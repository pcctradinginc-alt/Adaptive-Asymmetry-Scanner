name: PortWatch LIVE contract probe (read-only, bounded)

on:
  pull_request:
    paths:
      - 'modules/external/sources/maritime.py'
      - 'tests/test_portwatch_objectid_recovery_20261117.py'
      - 'scripts/portwatch_live_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portwatch-live-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml
      - name: Verify actual publisher returnIdsOnly / objectIds behavior
        run: python -m scripts.portwatch_live_contract
