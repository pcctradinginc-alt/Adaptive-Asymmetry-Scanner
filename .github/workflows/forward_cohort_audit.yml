name: Forward cohort provenance audit (research only)

on:
  pull_request:
    paths:
      - 'modules/forward_cohort_audit.py'
      - 'tests/test_forward_cohort_audit.py'
      - '.github/workflows/forward_cohort_audit.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pandas numpy
      - name: Adversarial provenance regression suite
        run: python -m pytest -q tests/test_forward_cohort_audit.py
      - name: Generate honest independent-date research audit
        run: python -m modules.forward_cohort_audit
      - name: Persist research-only diagnostic on main
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: descriptive forward-cohort audit $(date -u +%Y-%m-%d)" outputs/research/forward_cohort_audit.json
