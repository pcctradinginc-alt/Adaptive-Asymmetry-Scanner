name: External Data Preflight

# Manueller Live-Check ALLER registrierten externen Quellen (inkl.
# disabled/deferred) — archiviert NICHTS, nur Status/Grund je Quelle.

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"   # Log-Zeilen sofort sichtbar (Hänger lokalisierbar)

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Preflight
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASSWORD: ${{ secrets.DESTATIS_PASSWORD }}
          NCEI_CDO_TOKEN: ${{ secrets.NCEI_CDO_TOKEN }}
          NWS_USER_AGENT_CONTACT: ${{ secrets.NWS_USER_AGENT_CONTACT }}
        run: |
          mkdir -p outputs/external_data/health
          python -m modules.external.orchestrator preflight --json outputs/external_data/health/preflight_report.json

      - name: Collect license evidence (Primärbelege, keine Entscheidung)
        continue-on-error: true
        run: python scripts/license_evidence.py

      - name: Source discovery in offiziellen Katalogen (keine Entscheidung)
        continue-on-error: true
        run: python scripts/source_discovery.py

      - name: Print report
        run: cat outputs/external_data/health/preflight_report.json

      - name: Commit preflight report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: external data preflight $(date -u +%Y-%m-%dT%H:%M)" outputs/external_data/health/preflight_report.json outputs/external_data/health/license_evidence.json outputs/external_data/health/source_discovery.json
