name: Workflow Watchdog (Missed-Run-Recovery)

# Erkennt verpasste Läufe der kritischen Workflows (External Data, Source Health, Scanner, Feedback) und
# löst je Workflow und UTC-Tag höchstens EINEN Recovery-Dispatch aus (config/workflow_schedule.yaml,
# scripts/workflow_watchdog.py). Kein Endlos-Retry; Pflicht-Upstream fehlt -> Downstream wird nicht angestoßen.
# Auslösung redundant (2026-10-19): am Mo 19.10. kamen von 12 Watchdog-Crons bis 18:30 UTC nur 2 (04:48, 13:26).
# Deshalb zusätzlich stündlich im Handelstag-Fenster und als workflow_run nach Läufen, die ohnehin stattfinden
# (6 Options-Capture-Crons je Werktag, External Data täglich). Kein Retry-Kreis: der Watchdog dispatcht nur
# Source Health/Scanner/External Data/Feedback je max. 1x pro Tag; Source Health/Scanner/Feedback lösen ihn nicht aus,
# External Data nur einmal mehr (Recovery-Budget dann verbraucht). Seine Status-Commits (GITHUB_TOKEN) triggern nichts.
# Grenze: fallen ALLE Schedules des Repos aus, fällt auch er aus (sichtbar im Report an fehlenden Tagen).

on:
  schedule:
    - cron: '23 */2 * * *'          # alle 2 h (GitHub-Verzögerung egal: Frist je Workflow in max_delay_hours)
    - cron: '53 13-20 * * 1-5'      # zusätzlich stündlich, solange ein Scanner-Lauf noch möglich ist
  workflow_run:
    workflows: ["Options-Capture (RTH, nur Quote-Archiv)", "External Data Ingestion"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: workflow-watchdog
  cancel-in-progress: false

permissions:
  actions: write     # workflow_dispatch für den einen Recovery-Lauf + Run-Liste lesen
  contents: write    # outputs/state/workflow_status.json

env:
  PYTHONUNBUFFERED: "1"

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_REF: main
        run: python scripts/workflow_watchdog.py

      - name: Commit workflow status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: workflow status $(date -u +%Y-%m-%dT%H:%M)" outputs/state/workflow_status.json
