name: Options Feature Cohort Diagnosis (offline)

on:
  pull_request:
    paths:
      - 'modules/option_feature_diagnostics.py'
      - 'tests/test_option_feature_diagnostics.py'
      - '.github/workflows/option_feature_diagnostics.yml'
      - '.github/workflows/ml_research.yml'

permissions:
  contents: read

jobs:
  feature-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install offline research dependencies
        run: pip install -r requirements.txt pytest
      - name: Contract regression tests
        run: python -m pytest -q -p no:cacheprovider tests/test_option_feature_diagnostics.py
      - name: Reconcile actual archived 5d and 20d cohorts
        run: python -m modules.option_feature_diagnostics --as-of 2026-11-14
      - name: Archive read-only diagnosis for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: option-feature-cohort-diagnosis
          path: |
            outputs/research/option_learner/feature_diagnostics.json
            outputs/research/option_learner/feature_diagnostics.md
          if-no-files-found: warn
          retention-days: 30
