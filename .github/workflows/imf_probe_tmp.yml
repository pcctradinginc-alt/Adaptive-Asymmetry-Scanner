name: IMF vintage probe (temporary, read-only)
on:
  push:
    branches: [claude/fix-imf-sources-n83dnw]
    paths: ['scripts/imf_vintage_probe_tmp.py', '.github/workflows/imf_probe_tmp.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install requests
      - run: python scripts/imf_vintage_probe_tmp.py
