name: External Data Ingestion

# Point-in-Time-Archiv externer Quellen (Road/Maritime Freight, Weather, Real
# Economy) — siehe modules/external/. Reine Observability solange
# external_context.mode != production.

on:
  schedule:
    - cron: '17 6 * * *'   # täglich 06:17 UTC
  workflow_dispatch:

concurrency:
  group: external-data-write   # nie parallel auf outputs/external_data/ schreiben
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run External-Data Ingestion
        env:
          ESTAT_APP_ID:   ${{ secrets.ESTAT_APP_ID }}
          FRED_API_KEY:   ${{ secrets.FRED_API_KEY }}
          DESTATIS_USER:     ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASSWORD: ${{ secrets.DESTATIS_PASSWORD }}
          NCEI_CDO_TOKEN: ${{ secrets.NCEI_CDO_TOKEN }}
          NWS_USER_AGENT_CONTACT: ${{ secrets.NWS_USER_AGENT_CONTACT }}
          GMAIL_SENDER:   ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:   ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:   ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_SHA:     ${{ github.sha }}
        run: python -m modules.external.orchestrator ingest

      - name: Commit archived external data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/external_data/
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: external data ingestion $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
