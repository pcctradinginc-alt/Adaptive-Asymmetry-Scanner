name: External Data Ingestion

# Point-in-Time-Archiv externer Quellen (Road/Maritime Freight, Weather, Real
# Economy) — siehe modules/external/. Reine Observability solange
# external_context.mode != production.

on:
  schedule:
    - cron: '17 6 * * *'   # täglich 06:17 UTC
  workflow_dispatch:

concurrency:
  group: external-data-write   # nie parallel auf outputs/external_data/ schreiben
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # Log-Zeilen sofort sichtbar (Hänger lokalisierbar)

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # je Quelle Zeitbudget (orchestrator), Hänger blockieren nicht mehr alle

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install optional S3-Storage-Backend dependency (boto3)
        # Nur installieren, wenn ein Bucket konfiguriert ist -- sonst bleibt
        # backend: s3 in config.yaml wirkungslos (kein boto3 nötig, kein
        # zusätzliches Deployment-Risiko für den Default-Pfad "git").
        if: env.EXTERNAL_ARCHIVE_S3_BUCKET != ''
        env:
          EXTERNAL_ARCHIVE_S3_BUCKET: ${{ secrets.EXTERNAL_ARCHIVE_S3_BUCKET }}
        run: pip install -r requirements-storage.txt

      - name: Run External-Data Ingestion
        env:
          ESTAT_APP_ID:   ${{ secrets.ESTAT_APP_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_KEY }}
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          DESTATIS_USER:     ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASSWORD: ${{ secrets.DESTATIS_PASSWORD }}
          NCEI_CDO_TOKEN: ${{ secrets.NCEI_CDO_TOKEN }}
          NWS_USER_AGENT_CONTACT: ${{ secrets.NWS_USER_AGENT_CONTACT }}
          GMAIL_SENDER:   ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:   ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:   ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_SHA:     ${{ github.sha }}
          # Optionales Object-Storage-Backend (external_context.archive.backend:
          # s3 in config.yaml). Ohne EXTERNAL_ARCHIVE_S3_BUCKET wirkungslos.
          EXTERNAL_ARCHIVE_S3_BUCKET:   ${{ secrets.EXTERNAL_ARCHIVE_S3_BUCKET }}
          EXTERNAL_ARCHIVE_S3_ENDPOINT: ${{ secrets.EXTERNAL_ARCHIVE_S3_ENDPOINT }}
          EXTERNAL_ARCHIVE_S3_PREFIX:   ${{ secrets.EXTERNAL_ARCHIVE_S3_PREFIX }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
        run: python -m modules.external.orchestrator ingest

      - name: Commit archived external data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: external data ingestion $(date -u +%Y-%m-%dT%H:%M)" outputs/external_data/
