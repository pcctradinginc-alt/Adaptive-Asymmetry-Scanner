name: PortWatch Recovery (read-only source, fail-closed)

# Bounded daily source recovery. A missing/failed archive or newly available
# official rows are a red failure. Proven delay in IMF publication is a visible
# WARNING, not a false ingestion failure; no stale data is marked fresh.
# Shared archive-write concurrency prevents write races.
on:
  # Changing this workflow on main triggers one bounded recovery immediately.
  # No broad push trigger and no production-trading code changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/portwatch_recovery.yml'
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external-data-write
  cancel-in-progress: false

jobs:
  retry-maritime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Retry official maritime sources with existing quotas, gates and PIT checks
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m modules.external.orchestrator ingest --family maritime --json /tmp/portwatch_recovery_summary.json
      - name: Archive result and error evidence without rewriting unrelated sources
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: bounded PortWatch recovery $(date -u +%Y-%m-%dT%H:%M)" outputs/external_data/

      - name: Verify archival integrity and classify official publisher delay
        if: always()
        run: python scripts/verify_portwatch_recovery.py
