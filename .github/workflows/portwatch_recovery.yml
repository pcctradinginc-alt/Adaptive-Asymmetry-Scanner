name: PortWatch Recovery (read-only source, fail-closed)

# Second daily attempt at a different UTC window. The public ArcGIS minute quota
# is shared with other clients; success cannot be guaranteed. Only maritime
# sources are ingested; shared archive-write concurrency prevents write races.
on:
  # Changing this workflow on main triggers one bounded recovery immediately.
  # No broad push trigger and no production-trading code changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/portwatch_recovery.yml'
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external-data-write
  cancel-in-progress: false

jobs:
  retry-maritime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Retry official maritime sources with existing quotas, gates and PIT checks
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m modules.external.orchestrator ingest --family maritime --json /tmp/portwatch_recovery_summary.json
      - name: Archive result and error evidence without rewriting unrelated sources
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: bounded PortWatch recovery $(date -u +%Y-%m-%dT%H:%M)" outputs/external_data/

      - name: Verify actual recovery of both important PortWatch sources
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          required = ("imf_portwatch_chokepoints", "imf_portwatch_ports")
          target = Path("/tmp/portwatch_recovery_summary.json")
          health_path = Path("outputs/external_data/health/source_health.json")
          if not target.exists() or not health_path.exists():
              print("::error::No summary/archived health evidence; recovery not verified")
              raise SystemExit(1)
          summary = json.loads(target.read_text(encoding="utf-8"))
          sources = summary.get("sources") or {}
          health = json.loads(health_path.read_text(encoding="utf-8"))
          failures = []
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## PortWatch recovery — official provider and archive verdict\\n\\n")
              for source in required:
                  entry = sources.get(source) or {}
                  record = health.get(source) or {}
                  status = entry.get("status", "NOT_REPORTED")
                  archived = record.get("status", "NOT_ARCHIVED")
                  skipped = entry.get("skipped")
                  last_success = record.get("last_success")
                  latest = record.get("latest_observation")
                  message = record.get("message", "")
                  output.write(
                      f"- {source}: run={status}, archive={archived}, skipped={skipped or 'no'}, "
                      f"last_success={last_success}, observation={latest}, "
                      f"message={message[:160]}\\n"
                  )
                  if status != "PASS" or archived != "PASS" or skipped:
                      failures.append(source + ": not fully PASS")
                  if entry.get("archive_error") or entry.get("pit_errors") or entry.get("dq_issues"):
                      failures.append(source + ": archival, PIT or DQ failure")
                  try:
                      retrieved = datetime.fromisoformat(last_success.replace("Z", "+00:00"))
                      if datetime.now(timezone.utc) - retrieved > timedelta(minutes=40):
                          failures.append(source + ": not freshly archived by this recovery")
                      observed = datetime.fromisoformat(latest.replace("Z", "+00:00")).date()
                      if observed < date.today() - timedelta(days=8):
                          failures.append(source + ": provider observations not current")
                  except (ValueError, TypeError, AttributeError):
                      failures.append(source + ": missing/unparseable archive timestamps")
                  if source == "imf_portwatch_ports":
                      # A mere status PASS is insufficient if the prior four
                      # curated ports were never revalidated and archived.
                      if "0 unresolved ports" not in message:
                          failures.append(source + ": curated identities unresolved")
                      if latest and latest[:10] <= "2026-11-13":
                          failures.append(source + ": archival observation did not advance")
          if failures:
              print("::error::PortWatch recovery not proven: " + "; ".join(failures))
              raise SystemExit(1)
          print("Both important PortWatch datasets freshly archived with current complete evidence")
          PY
