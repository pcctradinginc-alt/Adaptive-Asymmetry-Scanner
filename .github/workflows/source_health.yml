name: Source Health Check (täglich, vor dem Scanner)

# Prüft ALLE externen Datenquellen (Champion-Pflichtdaten, Registry-Quellen, Alternative Daten):
# Erreichbarkeit, Auth, Status, Rate Limit, Latenz, Schema, Freshness, Missing, Duplikate,
# Ausreißer, Plausibilität, neue Daten, Downstream-Nutzung. Schreibt outputs/health/ (Snapshot,
# Historie, Feature-Availability, Data Safe Mode, Report). Der Scanner liest NUR diesen Snapshot.
# Mail nur bei relevanter Änderung (Status, Fallback, Safe Mode, Recovery).

on:
  schedule:
    - cron: '41 12 * * *'   # täglich 12:41 UTC – nach External Data (06:17), vor dem Scanner (13:30)
  workflow_dispatch:

concurrency:
  group: source-health-write
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Source Health Check
        env:
          TRADIER_API_KEY:  ${{ secrets.TRADIER_API_KEY }}
          FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}
          GMAIL_SENDER:     ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:     ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:     ${{ secrets.NOTIFY_EMAIL }}
        run: python -m modules.source_health check

      - name: Commit health snapshot
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs/health
          git add outputs/health/
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: source health $(date -u +%Y-%m-%dT%H:%M)"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
