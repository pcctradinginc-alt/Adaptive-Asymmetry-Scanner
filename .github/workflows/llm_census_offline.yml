name: LLM Census (independent research)

on:
  schedule:
    # After NY session / Scanner output commit; missing frozen files fail closed.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-llm-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout frozen Scanner inputs
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Research-only LLM census
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_ONLY_LLM_CENSUS: '1'
        run: python -m modules.llm_census_offline --day "$(date -u +%Y-%m-%d)"
      - name: Commit independent outcomes (never Candidate Ledger)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore(research): independent LLM census $(date -u +%Y-%m-%d)" \
            outputs/research/llm_census_offline/ outputs/costs/
