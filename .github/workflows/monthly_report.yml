name: Monthly Performance Report

on:
  schedule:
    - cron: '0 7 1 * *'   # 1. des Monats, 07:00 UTC
  workflow_dispatch:        # manuell auslösbar zum Testen

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send monthly report
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python monthly_report.py

      - name: Inkrementalanalyse Base vs. externe Familien (EXPLORATIV)
        run: python scripts/incremental_analysis.py > /dev/null || true

      - name: Alpha-Entdeckung + Registrierung prospektiver Challenger
        run: |
          python -m modules.alpha_discovery || true
          python -c "from modules.challenger_registrar import run_auto; print(run_auto())" || true

      - name: Faktor-Monitor (Walk-Forward, Decay, Regime, Drift; nur SHADOW)
        # continue-on-error statt "|| true": ein Fehler bleibt im Lauf sichtbar
        continue-on-error: true
        run: python -m modules.factor_monitor

      - name: Commit research outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/research/ challengers.yaml config/challenger_proposals_auto.yaml 2>/dev/null || git add outputs/research/ challengers.yaml || true
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: incremental analysis $(date -u +%Y-%m-%dT%H:%M)"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
