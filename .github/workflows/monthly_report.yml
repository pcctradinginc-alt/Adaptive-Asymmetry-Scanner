name: Monthly Performance Report

on:
  schedule:
    - cron: '0 7 1 * *'   # 1. des Monats, 07:00 UTC
  workflow_dispatch:        # manuell auslösbar zum Testen

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send monthly report
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python monthly_report.py

      - name: Inkrementalanalyse Base vs. externe Familien (EXPLORATIV)
        id: incremental
        continue-on-error: true
        run: python scripts/incremental_analysis.py > /dev/null

      - name: Alpha-Entdeckung (EXPLORATIV)
        id: alpha
        continue-on-error: true
        run: python -m modules.alpha_discovery

      - name: Registrierung prospektiver Challenger
        id: registrar
        continue-on-error: true
        run: python -c "from modules.challenger_registrar import run_auto; print(run_auto())"

      - name: Faktor-Monitor (Walk-Forward, Decay, Regime, Drift; nur SHADOW)
        # continue-on-error statt "|| true": ein Fehler bleibt im Lauf sichtbar
        id: factor
        continue-on-error: true
        run: python -m modules.factor_monitor

      - name: Commit research outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: incremental analysis $(date -u +%Y-%m-%dT%H:%M)" outputs/research/ challengers.yaml config/challenger_proposals_auto.yaml

      - name: Stufen-Bilanz (zentrale Stufe ausgefallen -> Lauf rot, nach dem Commit)
        if: always()
        env:
          CRITICAL: "challenger_registrar=${{ steps.registrar.outcome }} alpha_discovery=${{ steps.alpha.outcome }}"
          DEGRADED: "incremental_analysis=${{ steps.incremental.outcome }} factor_monitor=${{ steps.factor.outcome }}"
        run: bash scripts/ci_stage_check.sh
