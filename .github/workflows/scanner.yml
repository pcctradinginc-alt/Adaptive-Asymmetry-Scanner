name: Adaptive Asymmetry Scanner

on:
  schedule:
    - cron: '30 13 * * 1-5'  # 13:30 UTC = 15:30 MEZ (entspricht US-Marktöffnung); frühester Start (Guard)
  # Reihenfolge über Abhängigkeit statt Cron-Versatz (2026-10-09): sobald Source Health fertig ist, startet
  # der Scanner – der Guard lässt ihn nur mit frischem Snapshot, nie vor 13:30 UTC und nie zweimal je Tag laufen.
  workflow_run:
    workflows: ["Source Health Check (täglich, vor dem Scanner)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Upstream-Guard übersteuern (wird protokolliert)"
        type: boolean
        default: false

concurrency:
  group: history-write    # nie parallel zum Feedback-Workflow auf history.json schreiben
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # Log-Zeilen sofort sichtbar (Hänger lokalisierbar)

jobs:
  # Freshness-Gate (scripts/upstream_guard.py, config/workflow_schedule.yaml): Scanner startet nur mit
  # Source-Health-Snapshot aus dem aktuellen Tageszyklus; sonst UPSTREAM_NOT_READY (Warnung, kein stiller Lauf).
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      status: ${{ steps.g.outputs.status }}
    steps:
      - name: Checkout (aktueller main-Stand, nicht der Event-Commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install guard dependency
        run: pip install pyyaml
      - name: Upstream-Guard
        id: g
        run: python scripts/upstream_guard.py scanner ${{ inputs.force == true && '--force' || '' }}

  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 110       # Hartes Limit (Audit 2026-10-04: Scanner ~55 min + V2-Shadow-Scan max. 25 min + Feedback;
                               # Produktions-Commit liegt VOR dem V2-Scan -> ein V2-Timeout kostet nie die history.json). Vorher 75. 45 -> 75: gedrosselter Finnhub-Abruf (55/min) und volles Universum statt nur A–E (2026-09-28)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main   # derselbe frische Stand, den der Guard geprüft hat
          fetch-depth: 1

      # ── FinBERT Model Cache ──────────────────────────────────────────────
      # Wichtig: Cache persistiert zwischen Runs → kein 440MB Download täglich
      - name: Cache FinBERT Model
        uses: actions/cache@v4
        id: finbert-cache
        with:
          path: /tmp/finbert_cache
          key: finbert-prosusai-v1
          restore-keys: finbert-prosusai-

      # ── Python + pip Cache ───────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Scanner ──────────────────────────────────────────────────────────
      - name: Run Scanner
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_API_KEY:       ${{ secrets.TRADIER_API_KEY }}
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          GMAIL_SENDER:          ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:          ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:          ${{ secrets.NOTIFY_EMAIL }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY || secrets.FRED_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          HF_HUB_CACHE:          /tmp/finbert_cache
          TRANSFORMERS_CACHE:    /tmp/finbert_cache
          HF_HOME:               /tmp/finbert_cache
        run: python pipeline.py

      # ── Feedback Loop ────────────────────────────────────────────────────
      - name: Run Feedback Loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_API_KEY:   ${{ secrets.TRADIER_API_KEY }}
        run: python feedback.py

      # ── Git Commit ───────────────────────────────────────────────────────
      - name: Commit daily report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: daily report $(date -u +%Y-%m-%d)" outputs/

      # ── UNIVERSE_V2 Shadow-Scan (LLM-frei, keine Produktionswirkung) ─────
      - name: UNIVERSE_V2 Shadow-Scan
        id: v2scan
        continue-on-error: true
        timeout-minutes: 25
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY:    ${{ secrets.NEWS_API_KEY }}
        run: python -m modules.universe_v2_scan

      - name: Commit UNIVERSE_V2 shadow ledger
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: UNIVERSE_V2 shadow ledger $(date -u +%Y-%m-%d)" outputs/universe/

      - name: Stufen-Bilanz (V2-Shadow-Scan ausgefallen -> Lauf rot, nach dem Commit)
        if: always()
        env:
          CRITICAL: "universe_v2_shadow_scan=${{ steps.v2scan.outcome }}"
        run: bash scripts/ci_stage_check.sh
