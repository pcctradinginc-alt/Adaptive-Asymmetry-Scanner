name: Adaptive Asymmetry Scanner

on:
  schedule:
    # Zwei Crons, weil die US-Eröffnung 09:30 New York mit der Zeitumstellung wandert: 13:30 UTC (Sommer) und
    # 14:30 UTC (Winter). Der Guard lässt nie vor 09:30 ET (not_before_ny), nie an NYSE-Feiertagen und nie zweimal
    # je Tag laufen -> der jeweils andere Trigger endet nach ~1 min mit SKIP. (Real starten die Crons 4–7 h später.)
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
  # Reihenfolge über Abhängigkeit statt Cron-Versatz (2026-10-09): sobald Source Health fertig ist, startet
  # der Scanner – der Guard lässt ihn nur mit frischem Snapshot, nie vor 09:30 New York und nie zweimal je Tag laufen.
  workflow_run:
    workflows: ["Source Health Check (täglich, vor dem Scanner)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Upstream-Guard übersteuern (wird protokolliert)"
        type: boolean
        default: false

concurrency:
  group: history-write    # nie parallel zum Feedback-Workflow auf history.json schreiben
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # Log-Zeilen sofort sichtbar (Hänger lokalisierbar)

jobs:
  # Freshness-Gate (scripts/upstream_guard.py, config/workflow_schedule.yaml): Scanner startet nur mit
  # Source-Health-Snapshot aus dem aktuellen Tageszyklus; sonst UPSTREAM_NOT_READY (Warnung, kein stiller Lauf).
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      status: ${{ steps.g.outputs.status }}
    steps:
      - name: Checkout (aktueller main-Stand, nicht der Event-Commit)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install guard dependency
        run: pip install pyyaml
      - name: Upstream-Guard
        id: g
        run: python scripts/upstream_guard.py scanner ${{ inputs.force == true && '--force' || '' }}

  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 110       # Hartes Limit (Audit 2026-10-04: Scanner ~55 min + V2-Shadow-Scan max. 25 min + Feedback;
                               # Produktions-Commit liegt VOR dem V2-Scan -> ein V2-Timeout kostet nie die history.json). Vorher 75. 45 -> 75: gedrosselter Finnhub-Abruf (55/min) und volles Universum statt nur A–E (2026-09-28)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main   # derselbe frische Stand, den der Guard geprüft hat
          fetch-depth: 1

      # ── FinBERT Model Cache ──────────────────────────────────────────────
      # Wichtig: Cache persistiert zwischen Runs → kein 440MB Download täglich
      - name: Cache FinBERT Model
        uses: actions/cache@v5
        id: finbert-cache
        with:
          path: /tmp/finbert_cache
          key: finbert-prosusai-v1
          restore-keys: finbert-prosusai-

      # ── Python + pip Cache ───────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Options-Marks im RTH-Fenster (vor der langen Pipeline) ──────────
      # Real-Options-Marks und Quotes aktiver Champion-Kontrakte nur im Fenster der regulären Sitzung (NYSE-Kalender,
      # DST-fest, >= 30 min nach Eröffnung). Zusätzliche, vom Scanner unabhängige Erfassung: options_capture.yml.
      # Idempotent, nie entscheidungswirksam, außerhalb des Fensters ein No-op (scripts/rth_marks.py).
      - name: Options-Marks (RTH)
        id: rthmarks
        continue-on-error: true
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
        run: python scripts/rth_marks.py

      # Sofort persistieren (vor der ~50-min-Pipeline): ein späterer Scanner-Fehler kostet die Marks/Quotes nicht.
      # Zu diesem Zeitpunkt hat nur der Marks-Schritt outputs/ verändert -> breiter Commit, nichts wird gestasht.
      - name: Commit Options-Marks
        if: steps.rthmarks.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: options marks (RTH) $(date -u +%Y-%m-%dT%H:%M)" outputs/

      # ── Scanner ──────────────────────────────────────────────────────────
      - name: Run Scanner
        id: scanner
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_API_KEY:       ${{ secrets.TRADIER_API_KEY }}
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          GMAIL_SENDER:          ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:          ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:          ${{ secrets.NOTIFY_EMAIL }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY || secrets.FRED_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          HF_HUB_CACHE:          /tmp/finbert_cache
          TRANSFORMERS_CACHE:    /tmp/finbert_cache
          HF_HOME:               /tmp/finbert_cache
          # optional (kostenloses Hugging-Face-Read-Token): höhere Download-Limits, keine Warnung "unauthenticated".
          # Fehlt das Secret, ist der Wert leer und huggingface_hub läuft wie bisher anonym.
          HF_TOKEN:              ${{ secrets.HF_TOKEN }}
        run: python pipeline.py

      # ── Feedback Loop ────────────────────────────────────────────────────
      - name: Run Feedback Loop
        id: feedback
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_API_KEY:   ${{ secrets.TRADIER_API_KEY }}
        run: python feedback.py

      # ── Ops-Monitoring (READ-ONLY, nach jedem regulären Scanner-Lauf) ───
      # Liest nur Ledger/Archive/Zustände, schreibt ausschließlich outputs/monitoring/ (JSON/MD/HTML, Verlauf,
      # Alarm-Zustand). Läuft auch nach einem Scanner-Fehler (always), meldet ihn als Warnung; Mail nur bei
      # neuen/geänderten/kritischen Warnungen (bestehende Mail-Infrastruktur). Nie lauf-blockierend.
      - name: Ops-Monitoring (read-only)
        if: always()
        continue-on-error: true
        env:
          OPS_STEP_OUTCOMES: "rth_marks=${{ steps.rthmarks.outcome }} scanner=${{ steps.scanner.outcome }} feedback=${{ steps.feedback.outcome }}"
          # nur lesend: Lauf-/Job-Liste + Job-Logs für den Fehler-Digest (modules/ops_workflows.py)
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GMAIL_SENDER:    ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:    ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:    ${{ secrets.NOTIFY_EMAIL }}
        run: python -m modules.ops_report --mail

      # ── Git Commit ───────────────────────────────────────────────────────
      # (enthält outputs/monitoring/; ci_push.sh stasht nicht committete Dateien -> kein schmaler Commit davor)
      - name: Commit daily report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: daily report $(date -u +%Y-%m-%d)" outputs/

      # Nach einem Fehler nur append-only Beobachtungen sichern (Quote-Archiv, Monitoring) – nie halbfertige
      # Zustände (history.json, Ledger) eines abgebrochenen Laufs.
      - name: Commit Beobachtungen nach Scanner-Fehler
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: ops monitoring + quote archive (Scanner-Fehler) $(date -u +%Y-%m-%dT%H:%M)" outputs/monitoring/ outputs/options_archive/

      # Letzte Sicherung, falls ein Push scheitert (Konflikt/Netz): Daten als Run-Artefakt (14 Tage) statt Verlust
      # mit dem kurzlebigen Runner. Wiederherstellung: docs/OPERATIONS_READINESS.md.
      - name: Daten-Sicherung als Artefakt (nur nach Fehler)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-data-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            outputs/options_archive/
            outputs/candidate_ledger/
            outputs/monitoring/
            outputs/history.json
            outputs/daily_reports/

      # ── UNIVERSE_V2 Shadow-Scan (LLM-frei, keine Produktionswirkung) ─────
      - name: UNIVERSE_V2 Shadow-Scan
        id: v2scan
        continue-on-error: true
        timeout-minutes: 25
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY:    ${{ secrets.NEWS_API_KEY }}
        run: python -m modules.universe_v2_scan

      - name: Commit UNIVERSE_V2 shadow ledger
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: UNIVERSE_V2 shadow ledger $(date -u +%Y-%m-%d)" outputs/universe/

      - name: Stufen-Bilanz (V2-Shadow-Scan ausgefallen -> Lauf rot, nach dem Commit)
        if: always()
        env:
          CRITICAL: "universe_v2_shadow_scan=${{ steps.v2scan.outcome }}"
        run: bash scripts/ci_stage_check.sh
