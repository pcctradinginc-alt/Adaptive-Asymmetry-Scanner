name: Adaptive Asymmetry Scanner

on:
  schedule:
    - cron: '30 13 * * 1-5'  # 13:30 UTC = 15:30 MEZ (entspricht US-Marktöffnung)
  workflow_dispatch:

concurrency:
  group: history-write    # nie parallel zum Feedback-Workflow auf history.json schreiben
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # Log-Zeilen sofort sichtbar (Hänger lokalisierbar)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75        # Hartes Limit. 45 -> 75: gedrosselter Finnhub-Abruf (55/min) und volles Universum statt nur A–E (2026-09-28)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # ── FinBERT Model Cache ──────────────────────────────────────────────
      # Wichtig: Cache persistiert zwischen Runs → kein 440MB Download täglich
      - name: Cache FinBERT Model
        uses: actions/cache@v4
        id: finbert-cache
        with:
          path: /tmp/finbert_cache
          key: finbert-prosusai-v1
          restore-keys: finbert-prosusai-

      # ── Python + pip Cache ───────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Scanner ──────────────────────────────────────────────────────────
      - name: Run Scanner
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_API_KEY:       ${{ secrets.TRADIER_API_KEY }}
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          GMAIL_SENDER:          ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:          ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:          ${{ secrets.NOTIFY_EMAIL }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FLASH_ALPHA_API_KEY:   ${{ secrets.FLASH_ALPHA_API_KEY }}
          EULERPOOL_API_KEY:     ${{ secrets.EULERPOOL_API_KEY }}
          HF_HUB_CACHE:          /tmp/finbert_cache
          TRANSFORMERS_CACHE:    /tmp/finbert_cache
          HF_HOME:               /tmp/finbert_cache
        run: python pipeline.py

      # ── Feedback Loop ────────────────────────────────────────────────────
      - name: Run Feedback Loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRADIER_API_KEY:   ${{ secrets.TRADIER_API_KEY }}
        run: python feedback.py

      # ── Git Commit ───────────────────────────────────────────────────────
      - name: Commit daily report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: daily report $(date +%Y-%m-%d)"
          # Rebase wie alle anderen Workflows: sonst scheitert der Push, wenn
          # während des Laufs ein anderer Workflow auf main committet hat, und
          # history.json des Tages ginge verloren (Review 2026-09-27)
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
