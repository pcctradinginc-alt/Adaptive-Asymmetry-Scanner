name: Research – ML-Kreislauf (Shadow, Walk-Forward, Champion/Challenger)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full (Walk-Forward+Locked+Attribution) oder weekly (Prognosen+Forward)"
        required: false
        default: full
  schedule:
    - cron: '41 7 3 * *'   # monatlich, 3. des Monats: full
    - cron: '23 8 * * 6'   # wöchentlich, Samstag: weekly

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: research-write
  cancel-in-progress: false

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main      # aktuellen Stand, nicht die SHA zum Auslösezeitpunkt (Audit F11: wartende Läufe nutzten alte Artefakte)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Alternative-Data-Feature-Store (SEC, aus eingecheckten Events, PIT)
        continue-on-error: true   # fehlt er, sind Alt-Features NaN / verfügbar 0 – Champion unberührt
        run: python -m modules.external.sources.sec_ingest --features-only

      - name: Alternative-Data-Feature-Store (SEC XBRL, aus eingecheckten Beobachtungen, PIT)
        continue-on-error: true
        run: python -m modules.external.sources.sec_xbrl --features-only

      - name: Alternative-Data-Feature-Store (TED, aus eingecheckten Events, PIT)
        continue-on-error: true
        run: python -m modules.external.sources.ted_ingest --features-only

      - name: ML-Research (präregistriert, nur SHADOW)
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "23 8 * * 6" ]; then MODE=weekly; else MODE=full; fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" python -m modules.ml_research --mode "$MODE"

      - name: Research Director + Active Learning (nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        run: python -m modules.research_director

      - name: Scientific Hypothesis Factory – Plan (Ideen, DATA_GAP, Ähnlichkeit, Budget – nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: NUR Mechanismus-Text, nie Evidenz
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" python -m modules.hypothesis_factory plan --llm

      - name: Research-Lab (Hypothesen-Datenbank, Discovery, Director-Hypothesen – nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" python -m modules.research_lab

      - name: Scientific Hypothesis Factory – Robustheit, Prospective Challenger, Forward-Ledger (nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" python -m modules.hypothesis_factory evaluate

      - name: Alternative Data – inkrementeller Nutzen (Baseline vs. Baseline+Quelle, nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" python -m modules.alt_data.evaluate

      - name: Meta-Learning (Walk-Forward, Counterfactuals, Ablation, Gate – nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" META_RES_CACHE="$RUNNER_TEMP/meta.pkl" python -m modules.meta_learning

      - name: Kausalschicht + Knowledge Graph (nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        run: |
          python -m modules.causal_research
          python -m modules.knowledge_graph

      - name: Gesamtvalidierung A–G, Blind Spots, Stress, Decision Intelligence (nur full)
        if: env.MODE == 'full'
        continue-on-error: true
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" META_RES_CACHE="$RUNNER_TEMP/meta.pkl" python -m modules.next_intelligence

      - name: Meta-Cognition + Safe Mode (vor den Alerts)
        continue-on-error: true
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" python -m modules.meta_cognition

      - name: High-Confidence-Scanner + Alerts (keine Orderausführung)
        continue-on-error: true
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: ML_PANEL_CACHE="$RUNNER_TEMP/panel.pkl" python -m modules.hc_scanner --send

      - name: Trade-Gedächtnis + Failure Analyzer
        continue-on-error: true
        run: python -m modules.trade_memory

      # Audit F14 / P2-5: eingefrorener Daten-Snapshot für Reproduktionsläufe
      # (workflow repro.yml: ML_PANEL_SNAPSHOT=<dieses Artefakt>).
      - name: Panel-Snapshot sichern
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ github.run_id }}
          path: ${{ runner.temp }}/panel.pkl
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit research outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs/state
          mkdir -p outputs/state
          git add outputs/research/ outputs/state/
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: ml research $(date -u +%Y-%m-%dT%H:%M)"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
