name: Feedback Loop (Exit-Alarme + Lernen)

# Läuft zusätzlich zum Feedback-Schritt im Scanner-Workflow (≈14:00 UTC):
#   15:30 UTC — frühe US-Session: Stop-Loss/Take-Profit nach Markt-Open
#   19:30 UTC — 30 Min vor US-Close: letzte Exit-Chance am selben Tag
# Damit werden Exit-Regeln 3× täglich geprüft statt 1×.

on:
  schedule:
    - cron: '30 15 * * 1-5'
    - cron: '30 19 * * 1-5'
  workflow_dispatch:

concurrency:
  group: history-write    # nie parallel zum Scanner auf history.json schreiben
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Feedback Loop
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          GMAIL_SENDER:    ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:    ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:    ${{ secrets.NOTIFY_EMAIL }}
        run: python feedback.py

      - name: Meta-Label-Lernzyklus (SHADOW; Produktionswirkung nur über Vertrag PROM-META-001)
        # Neue Outcomes -> neues Modell (Purged/Embargo-Walk-Forward, Manifest, höchstens wöchentlich);
        # zu wenige Labels -> NEED_MORE_DATA. Fehler -> letzte aktive Version bleibt (Adapter: meta_p_take None).
        id: meta_label
        continue-on-error: true
        run: python -m modules.meta_label train

      - name: Challenger-Vorschläge registrieren (nach 10 Wochen Ledger)
        id: registrar
        continue-on-error: true
        run: python -m modules.challenger_registrar

      - name: Promotion Controller (Forward-Evidenz, Promotion/Demotion, promotion_state.json)
        # Einzige Stelle, die Produktionseinfluss vergibt (Default max. ABSTENTION_ONLY).
        # Fehler -> State bleibt unverändert; Adapter fällt auf Champion zurück.
        id: promotion
        continue-on-error: true
        env:
          GMAIL_SENDER:    ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW:    ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL:    ${{ secrets.NOTIFY_EMAIL }}
        run: python -m modules.promotion_controller --notify

      - name: Abstinenz-Hypothesen vorschlagen (Walk-Forward, nur Entwürfe – Registrierung per PR)
        id: abstention
        continue-on-error: true
        run: python -m modules.abstention_proposals

      - name: Commit updated history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: feedback loop $(date -u +%Y-%m-%dT%H:%M)" outputs/ challengers.yaml

      # Nach einem Fehler nur das append-only Quote-Archiv sichern (Exit-Quotes sind Beobachtungen); halbfertige
      # Zustände bleiben verworfen, der nächste Lauf rechnet sie neu.
      - name: Commit Quote-Archiv nach Fehler
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: quote archive (Feedback-Fehler) $(date -u +%Y-%m-%dT%H:%M)" outputs/options_archive/

      - name: Daten-Sicherung als Artefakt (nur nach Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-data-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            outputs/options_archive/
            outputs/candidate_ledger/
            outputs/history.json
            outputs/models/meta_label/
            outputs/intelligence/

      - name: Stufen-Bilanz (zentrale Stufe ausgefallen -> Lauf rot, nach dem Commit)
        if: always()
        env:
          CRITICAL: "promotion_controller=${{ steps.promotion.outcome }} challenger_registrar=${{ steps.registrar.outcome }}"
          DEGRADED: "abstention_proposals=${{ steps.abstention.outcome }} meta_label=${{ steps.meta_label.outcome }}"
        run: bash scripts/ci_stage_check.sh
