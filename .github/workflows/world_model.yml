name: Research – World Model (Shadow)

on:
  workflow_dispatch:
  schedule:
    - cron: '13 9 * * 0'   # wöchentlich, Sonntag (nach der Samstags-Ingestion und ML-Wochenlauf)

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: research-write
  cancel-in-progress: false

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: World Model + Validierung gegen Regime-Engine (präregistriert)
        run: python -m modules.world_model

      - name: Commit research outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p outputs/state
          git add outputs/research/ outputs/state/
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: world model $(date -u +%Y-%m-%dT%H:%M)"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
