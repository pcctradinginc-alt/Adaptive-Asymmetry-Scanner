name: IMF Macro Eight Feeds (research PIT)

# Shared write lock with external_data.yml: one archive writer at a time.
on:
  pull_request:
    paths:
      - 'modules/external/sources/imf_*.py'
      - 'modules/imf_macro_research.py'
      - 'config/external_sources/imf_macro.yaml'
      - '.github/workflows/imf_macro.yml'
      - 'tests/test_imf_macro_eight_feeds_20261104.py'
  push:
    branches: [main]
    paths:
      - 'modules/external/sources/imf_*.py'
      - 'modules/imf_macro_research.py'
      - 'config/external_sources/imf_macro.yaml'
      - '.github/workflows/imf_macro.yml'
  schedule:
    - cron: '43 17 * * 0'  # 1x weekly, Sunday 17:43 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR preflight is read-only and must not block the daily production writer.
  # Main branch ingestion shares the usual archive lock.
  group: ${{ github.event_name == 'pull_request' && format('imf-macro-preflight-{0}', github.event.pull_request.number) || 'external-data-write' }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Diagnose official IMF SDMX 3.0 routes (read-only; sanitized)
        if: github.event_name == 'pull_request'
        run: python scripts/imf_sdmx3_diagnose.py

      - name: Offline IMF data/PIT acceptance tests
        run: python -m pytest -q tests/test_imf_macro_eight_feeds_20261104.py

      - name: Live IMF SDMX/DataMapper preflight (no writes on PR)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p outputs/health
          python -m modules.external.orchestrator preflight --family imf_macro --json outputs/health/imf_macro_preflight.json

      - name: Enforce eight real preflight successes
        if: github.event_name == 'pull_request'
        run: |
          python -c 'import json,sys; p=json.load(open("outputs/health/imf_macro_preflight.json")); print([(x["source_id"], x["status"]) for x in p]); sys.exit(0 if len(p)==8 and all(x["status"] in ("PASS","WARN") and x.get("n_observations",0)>0 for x in p) else 1)'

      - name: Weekly IMF bounded ingestion into research-only archive
        if: github.event_name != 'pull_request'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p outputs/health
          python -m modules.external.orchestrator ingest --family imf_macro --json outputs/health/imf_macro_ingest.json

      - name: Build as-of feature candidate audit (no model promotion)
        if: github.event_name != 'pull_request'
        run: python -m modules.imf_macro_research --output outputs/research/imf_macro/status.json

      - name: Preserve health, evidence and research candidates
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: IMF eight macro PIT research $(date -u +%Y-%m-%d)" outputs/external_data/ outputs/health/imf_macro_ingest.json outputs/research/imf_macro/status.json

      - name: Validate eight sources actually ready (not a simulated pass)
        if: github.event_name != 'pull_request'
        run: python -m modules.imf_macro_research --assert-ready --output outputs/research/imf_macro/status.json

      - name: Upload diagnostics even if upstream fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: imf-macro-${{ github.run_id }}
          path: |
            outputs/health/imf_macro_preflight.json
            outputs/health/imf_macro_ingest.json
            outputs/research/imf_macro/status.json
          if-no-files-found: warn
          retention-days: 30
