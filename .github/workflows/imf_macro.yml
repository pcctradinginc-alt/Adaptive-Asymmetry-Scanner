name: IMF Macro Feeds (research PIT)

# Shared write lock with external_data.yml: one archive writer at a time.
on:
  pull_request:
    paths:
      - 'modules/external/sources/imf_*.py'
      - 'modules/imf_macro_research.py'
      - 'config/external_sources/imf_macro.yaml'
      - '.github/workflows/imf_macro.yml'
      - 'modules/external/data_quality.py'
      - 'tests/test_imf_sdmx3_feeds_20261105.py'
  push:
    branches: [main]
    paths:
      - 'modules/external/sources/imf_*.py'
      - 'modules/imf_macro_research.py'
      - 'config/external_sources/imf_macro.yaml'
      - '.github/workflows/imf_macro.yml'
  schedule:
    - cron: '43 17 * * 0'  # 1x weekly, Sunday 17:43 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR preflight is read-only and must not block the daily production writer.
  # Main branch ingestion shares the usual archive lock.
  group: ${{ github.event_name == 'pull_request' && format('imf-macro-preflight-{0}', github.event.pull_request.number) || 'external-data-write' }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Offline IMF data/PIT acceptance tests
        run: python -m pytest -q -p no:cacheprovider tests/test_imf_sdmx3_feeds_20261105.py

      - name: Live IMF SDMX 3.0 preflight (no writes on PR)
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p outputs/health
          python -m modules.external.orchestrator preflight --family imf_macro --json outputs/health/imf_macro_preflight.json

      - name: Enforce real preflight success for every enabled IMF feed
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json, sys
          rows = json.load(open("outputs/health/imf_macro_preflight.json"))
          active = [r for r in rows if r["status"] != "disabled"]
          for r in rows:
              print(r["source_id"], r["status"], r.get("n_observations"), (r.get("message") or "")[:200])
          ok = len(active) >= 7 and all(r["status"] in ("PASS", "WARN") and r.get("n_observations", 0) > 0 for r in active)
          sys.exit(0 if ok else 1)
          PY

      - name: Weekly IMF bounded ingestion into research-only archive
        if: github.event_name != 'pull_request'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p outputs/health
          python -m modules.external.orchestrator ingest --family imf_macro --json outputs/health/imf_macro_ingest.json

      - name: Build as-of feature candidate audit (no model promotion)
        if: github.event_name != 'pull_request'
        run: python -m modules.imf_macro_research --output outputs/research/imf_macro/status.json

      - name: Preserve health, evidence and research candidates
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: IMF macro PIT research $(date -u +%Y-%m-%d)" outputs/external_data/ outputs/health/imf_macro_ingest.json outputs/research/imf_macro/status.json

      - name: Validate all enabled IMF sources actually ready (not a simulated pass)
        if: github.event_name != 'pull_request'
        run: python -m modules.imf_macro_research --assert-ready --output outputs/research/imf_macro/status.json

      - name: Upload diagnostics even if upstream fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: imf-macro-${{ github.run_id }}
          path: |
            outputs/health/imf_macro_preflight.json
            outputs/health/imf_macro_ingest.json
            outputs/research/imf_macro/status.json
          if-no-files-found: warn
          retention-days: 30
