name: Research – historische Event-Studie (Walk-Forward)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 2 * *'   # monatlich, 2. des Monats 06:17 UTC

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: research-write
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Volumen-Event-Studie (präregistriert, nur SHADOW)
        run: python -m modules.price_event_study

      - name: Surprise Engine (Fundamental vs. Marktreaktion, präregistriert, nur SHADOW)
        id: surprise
        continue-on-error: true
        run: python -m modules.surprise_engine

      - name: Research Memory synchronisieren
        id: memory
        continue-on-error: true
        run: python -c "from modules import research_memory as rm; print(rm.sync())"

      - name: Commit research outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: research event study $(date -u +%Y-%m-%dT%H:%M)" outputs/research/price_event_study.json outputs/research/price_event_study.md outputs/research/surprise_study.json outputs/research/surprise_study.md outputs/research/research_memory.jsonl

      - name: Stufen-Bilanz (zentrale Stufe ausgefallen -> Lauf rot, nach dem Commit)
        if: always()
        env:
          CRITICAL: "research_memory_sync=${{ steps.memory.outcome }}"
          DEGRADED: "surprise_engine=${{ steps.surprise.outcome }}"
        run: bash scripts/ci_stage_check.sh
