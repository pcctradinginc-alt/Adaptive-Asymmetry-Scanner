name: Research – historische Event-Studie (Walk-Forward)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 2 * *'   # monatlich, 2. des Monats 06:17 UTC

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: research-write
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Volumen-Event-Studie (präregistriert, nur SHADOW)
        run: python -m modules.price_event_study

      - name: Commit research outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/research/price_event_study.json outputs/research/price_event_study.md
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: research event study $(date -u +%Y-%m-%dT%H:%M)"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
