name: FD3 PIT Research Tests

on:
  pull_request:
    paths:
      - modules/research_feature_store.py
      - modules/research_feature_discovery.py
      - modules/research_feature_validation.py
      - modules/research_feature_director.py
      - modules/research_feature_option_signals.py
      - modules/research_feature_option_economics.py
      - modules/autonomous_alpha/option_link.py
      - config/alpha_option_link.yaml
      - modules/research_memory.py
      - config/research_feature_discovery_v3.yaml
      - tests/test_research_feature_discovery_v3.py tests/test_research_feature_validation.py tests/test_research_feature_director.py tests/test_research_feature_option_economics.py tests/test_alpha_option_link.py
      - tests/test_research_feature_validation.py
      - tests/test_research_feature_director.py
      - tests/test_research_feature_option_economics.py
      - .github/workflows/feature_discovery_tests.yml
  workflow_dispatch:

jobs:
  pit-feature-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal offline test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: PIT availability, frozen learning and memory regression
        run: python -m pytest -q -p no:cacheprovider tests/test_research_feature_discovery_v3.py
