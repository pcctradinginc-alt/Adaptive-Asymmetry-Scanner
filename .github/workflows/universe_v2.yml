name: UNIVERSE_V2 Discovery (wöchentlich, Research/Shadow)

on:
  schedule:
    - cron: '13 7 * * 0'     # Sonntag 07:13 UTC
  workflow_dispatch:

concurrency:
  group: universe-v2
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: UNIVERSE_V1 prüfen + UNIVERSE_V2 Discovery (rollierend, PIT-Snapshot)
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
        run: python -m modules.universe_v2
      - name: Commit universe snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/universe/
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: UNIVERSE_V2 snapshot $(date -u +%Y-%m-%d)"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
