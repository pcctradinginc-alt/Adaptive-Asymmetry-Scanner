name: Weekly Intelligence Report

on:
  workflow_dispatch:
    inputs:
      send:
        description: "Mail senden (true) oder nur Dry-Run (false)"
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  schedule:
    - cron: '47 5 * * 1'   # Montag 05:47 UTC

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: research-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Weekly Report (Research-/Paper-Signale, keine Orderausführung)
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SEND: ${{ github.event.inputs.send }}
        run: |
          if [ "${SEND:-true}" = "false" ]; then
            python -m reports.weekly --dry-run
          else
            python -m reports.weekly --send
          fi

      - name: Commit report outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/reports/
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "chore: weekly report $(date -u +%Y-%m-%dT%H:%M)"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
