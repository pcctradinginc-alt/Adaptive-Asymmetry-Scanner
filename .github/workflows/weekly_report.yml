name: Weekly Intelligence Report

on:
  workflow_dispatch:
    inputs:
      send:
        description: "Mail senden (true) oder nur Dry-Run (false)"
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  schedule:
    - cron: '47 5 * * 1'   # Montag 05:47 UTC

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: research-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main      # aktuellen Stand, nicht die SHA zum Auslösezeitpunkt (Audit F11: wartende Läufe nutzten alte Artefakte)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Paper-Performance + Kalibrierung (in-sample Bänder, prequential OOS-Güte)
        id: calibration
        continue-on-error: true
        run: python scripts/paper_performance_analysis.py

      - name: Spread-Execution Shadow-Analyse (SHADOW_ONLY)
        id: spread_exec
        continue-on-error: true
        run: python -m scripts.spread_execution_analysis

      - name: Kernfrage-Ketten (Unklarheit -> Erklärung -> Daten -> Forward -> Verhalten)
        id: inquiry
        continue-on-error: true
        run: python -m modules.inquiry

      - name: RL-Promotion-Bewertung (nur Meldung, nie Veto-Aktivierung)
        id: rlpromo
        continue-on-error: true
        run: python -m modules.rl_promotion

      - name: Weekly Report (Research-/Paper-Signale, keine Orderausführung)
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SEND: ${{ github.event.inputs.send }}
        run: |
          if [ "${SEND:-true}" = "false" ]; then
            python -m reports.weekly --dry-run
          else
            python -m reports.weekly --send
          fi

      - name: Commit report outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: weekly report $(date -u +%Y-%m-%dT%H:%M)" outputs/reports/ outputs/state/ outputs/research/rl_promotion.json outputs/research/rl_promotion_history.jsonl outputs/research/inquiry_chains.json outputs/research/paper_performance_analysis.json outputs/research/paper_performance_analysis.md outputs/research/spread_execution_analysis.json

      - name: Stufen-Bilanz (zentrale Stufe ausgefallen -> Lauf rot, nach dem Commit)
        if: always()
        env:
          CRITICAL: "calibration=${{ steps.calibration.outcome }}"
          DEGRADED: "inquiry=${{ steps.inquiry.outcome }} rl_promotion=${{ steps.rlpromo.outcome }} spread_exec=${{ steps.spread_exec.outcome }}"
        run: bash scripts/ci_stage_check.sh
