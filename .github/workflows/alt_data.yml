name: Alternative Data – Entity Resolution + SEC Deep Events (SHADOW)

# Rohdaten -> normalisiert -> Entity-Mapping -> Event-Speicher (PIT, append-only).
# Feature-Tabelle wird im ML-Lauf aus den Events neu berechnet (nicht eingecheckt).
# Nur offizielle APIs (SEC EDGAR, GLEIF); keine Orderausführung, kein Produktionseinfluss.

on:
  schedule:
    - cron: '37 5 * * 5'   # wöchentlich Freitag, vor dem ML-Wochenlauf (Samstag)
  workflow_dispatch:
    inputs:
      start_year:
        description: "Erstes Jahr der Form-3/4/5-Bulk-Datensätze"
        required: false
        default: "2014"

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: research-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Entity Resolution (SEC + GLEIF, append-only, gültig-ab)
        id: entity
        continue-on-error: true      # SHADOW; Budget 75 min im Skript, harte Grenze 90 min; Teilstand bleibt gültig
        timeout-minutes: 90
        run: python -m modules.entity_resolution.build --max-minutes 75

      - name: SEC Deep Events (Form 3/4/5 Bulk, Submissions, Live-Form-4)
        run: python -m modules.external.sources.sec_ingest --start-year "${{ github.event.inputs.start_year || '2014' }}"

      - name: SEC XBRL companyfacts (PIT-Fundamentaldaten, inkrementell, budgetiert)
        continue-on-error: true   # Ausfall -> keine neuen Beobachtungen; Features veralten zu NaN, nie 0
        run: python -m modules.external.sources.sec_xbrl --budget 800

      - name: TED-Zuschläge (Feld-Probe + budgetierter Backfill)
        continue-on-error: true      # Fehler -> Jahre unvollständig -> Features NaN; SEC-Commit nicht blockieren
        run: python -m modules.external.sources.ted_ingest --start-year "${{ github.event.inputs.start_year || '2014' }}" --budget 1500

      - name: Commit entity map + SEC/TED event stores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci_push.sh "chore: alt data (entity + sec + ted) $(date -u +%Y-%m-%dT%H:%M)" outputs/entity/ outputs/external_data/sec/ outputs/external_data/ted/

      - name: Stufen-Bilanz (Entity-Resolution-Teilstand = Shadow-Warnung, nie still)
        if: always()
        env:
          DEGRADED: "entity_resolution=${{ steps.entity.outcome }}"
        run: bash scripts/ci_stage_check.sh
