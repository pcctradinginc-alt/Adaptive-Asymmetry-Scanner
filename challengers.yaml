# challengers.yaml – Pre-registered Challenger/Shadow/Walk-forward Registry
#
# WICHTIG: Diese Datei ist eine reine Beobachtungs-/Vorregistrierungs-Liste.
#   - modules/challenger.py LIEST diese Datei, schreibt sie NIEMALS.
#   - Eine "promote_recommended"-Empfehlung ändert NICHT automatisch
#     config.yaml. Ein Mensch prüft die Empfehlung und merged einen PR,
#     der `gates:` in config.yaml ändert. Erst das ist die "Promotion".
#   - Jeder Challenger wird VOR der Datensammlung registriert (Hypothese +
#     Regel + start_date), damit die Auswertung kein Post-hoc-Overfitting ist.
#     start_date liegt strikt NACH registered_on ("walk-forward" — es werden
#     nur Ledger-Zeilen mit date >= start_date ausgewertet). Ein Eintrag mit
#     start_date <= registered_on ist "invalid" und wird nie ausgewertet.
#   - registered_at (ISO-UTC-Zeitstempel der Registrierung) verschärft die
#     Walk-forward-Grenze zusätzlich: trägt eine Ledger-Zeile ein
#     signal_timestamp-Feld, ist sie nur eligible, wenn dieser Zeitstempel
#     ECHT NACH registered_at liegt (Zeilen ohne signal_timestamp fallen auf
#     date >= start_date zurück).
#   - Alpha-Spending (repeated looks): Challenger werden jeden Monat neu bewertet
#     bis sie promotiert oder expiriert sind. Um die Familie-weise Fehlerquote
#     (FWER) über wiederholte Looks zu kontrollieren, wird alpha-spending
#     verwendet: alpha = ALPHA_BASE / (n_active * n_looks), wobei
#     n_looks = ceil(max_duration_days / 30) geplante Looks sind. Ein optionales
#     planned_looks-Feld kann diese Berechnung überschreiben. Dies ist eine
#     konservative (Bonferroni-artige) Ansatz; Confidence Sequences sind eine
#     künftige Verbesserung.
#
# Feldreferenz:
#   id            eindeutiger Schlüssel
#   hypothesis    Freitext: was wird erwartet und warum
#   registered_on Datum der Registrierung (Commit-Datum dieses Eintrags)
#   registered_at (optional) ISO-UTC-Zeitstempel der Registrierung; verschärft
#                 die Walk-forward-Grenze für Zeilen mit signal_timestamp
#   start_date    erste Ledger-Zeile, die in die Auswertung einfließt
#   rule          Liste von {field, op, value} — AND-verknüpft; Feld über
#                 Punkt-Pfad in die Ledger-Zeile, z.B. "features.trade_score"
#   baseline_rule wie rule, aber für den Produktions-Arm (Default: status==proposed)
#   metric        Ziel-Metrik (Punkt-Pfad), z.B. "outcomes.opt_ret_45d";
#                 fällt bei fehlendem Feld auf eine Fallback-Metrik zurück
#   min_n         Mindest-Stichprobengröße je Arm, bevor ein Verdikt gefällt wird
#   horizon_days  Horizont in Tagen (informativ, für Report/Zeitplanung)
#   max_duration_days  nach registered_on+max_duration_days ohne Promotion → "expired"/"reject"
#   planned_looks (optional) überschreibt die automatische n_looks-Berechnung
#   status        active | promote_recommended | rejected | expired

challengers:
  - id: final_mc_dte_shadow
    # Gilt nur solange gates.final_mc_dte_mode = legacy_45 (dann ist der Schatten
    # der TTM-Horizont). Bei Promotion → Modus auf ttm stellen und diesen
    # Challenger auf status: promote_recommended/abgeschlossen setzen.
    hypothesis: >
      Gating mit dem MC-Horizont, der zur gehandelten DTE passt (Shadow-Hit-Rate
      auf dem tatsächlichen Horizont statt dem generischen final_mc_hit_rate),
      selektiert bessere Trades als das aktuelle final_mc-Gate.
    registered_on: "2026-09-26"
    registered_at: "2026-09-26T07:00:00Z"
    start_date: "2026-09-28"
    rule:
      - field: "features.final_mc_shadow_hit_rate"
        op: ">="
        value: 0.50
    baseline_rule:
      - field: "features.final_mc_hit_rate"
        op: ">="
        value: 0.45
    # Primär: echter Produktions-Strategie-Counterfactual (real_strategy —
    # spiegelt exakt, was die Produktion getradet hätte: Spread ODER Long-Leg,
    # je nach demselben choose_strategy()-Gate). real_opt_ret bleibt nur
    # sekundäre Diagnose (nur die Long-Leg). Umgestellt vor start_date
    # (2026-09-28) — noch keine Daten gesehen.
    metric: "outcomes.real_strat_ret_45d"
    min_n: 30
    horizon_days: 45
    max_duration_days: 180
    status: active

  - id: trade_score_61
    hypothesis: >
      Ein höheres Trade-Score-Gate (>=61 statt >=55) filtert schwächere
      Kandidaten heraus und verbessert den mittleren Return, ohne die
      Sample-Größe zu stark zu reduzieren.
    registered_on: "2026-09-26"
    registered_at: "2026-09-26T07:00:00Z"
    start_date: "2026-09-28"
    rule:
      - field: "features.trade_score"
        op: ">="
        value: 61
    baseline_rule:
      - field: "features.trade_score"
        op: ">="
        value: 55
    # Primär: echter Produktions-Strategie-Counterfactual (real_strategy —
    # spiegelt exakt, was die Produktion getradet hätte: Spread ODER Long-Leg,
    # je nach demselben choose_strategy()-Gate). real_opt_ret bleibt nur
    # sekundäre Diagnose (nur die Long-Leg). Umgestellt vor start_date
    # (2026-09-28) — noch keine Daten gesehen.
    metric: "outcomes.real_strat_ret_45d"
    min_n: 30
    horizon_days: 45
    max_duration_days: 180
    status: active

  - id: ppo_robust_shadow
    # Robuster PPO-Challenger (modules/rl_robust_shadow.py): Belohnung =
    # Log-Depotwachstum bei realem Positionsanteil (portfolio.max_position_pct)
    # statt Rendite; chronologisch trainiert, fester Seed, Walk-forward-
    # Diagnose in outputs/models/ppo_robust_shadow_meta.json. Die Aktion
    # steht NUR im Ledger (features.rl_robust_action), nie im Ranking.
    hypothesis: >
      Ein PPO mit wachstumsorientierter (konkaver) Belohnung trennt Trades
      besser als die Produktion ohne RL-Filter: die von ihm nicht
      übersprungenen Trades haben eine höhere reale Strategierendite bei
      nicht höherer Totalverlustquote. Stand Registrierung: in-sample und
      walk-forward 100 % NORMAL (keine Trennung) -- Challenger misst, ob
      sich das mit neuen Daten ändert.
    registered_on: "2026-09-27"
    registered_at: "2026-09-27T21:00:00Z"
    start_date: "2026-09-28"
    rule:
      - {field: "status", op: "==", value: "proposed"}
      - {field: "features.rl_robust_action", op: "in", value: ["NORMAL", "BOOST"]}
    baseline_rule:
      - {field: "status", op: "==", value: "proposed"}
    metric: "outcomes.real_strat_ret_45d"
    min_n: 30
    min_clusters: 12
    horizon_days: 45
    max_duration_days: 270
    status: active

  # ── Ab 2026-11-09: Alpha ausschließlich aus dem globalen Ledger (config/alpha_ledger.yaml, Klasse
  #    model_variant; Zuteilung durch modules/ledger_registration.py, ohne Zuteilung keine Bestätigung).
  #    Vor der Datensammlung registriert (start_date nach registered_on).
  - id: no_mc_gates
    # Aktionsplan 2026-11-09, Punkt 3. Die MC-Trefferquote ist eine deterministische Funktion aus σ,
    # Trend-Drift (hist_mu erklärt laut mirofish_simulation.py 73–90 % der Drift) und LLM-Scores, unkalibriert.
    # Gemessen wird nur, was nach der Deep Analysis gefiltert wird (Quick MC, Final MC); der Pre-MC vor der
    # Deep Analysis ist hier nicht messbar (dafür LLM-Zensus, modules/llm_census.py).
    hypothesis: >
      Die MC-Gates nach der Deep Analysis (Quick MC, Final MC) wählen keine besseren Optionen aus.
      Kandidaten, die die MC-Stufe erreichen (Mismatch berechnet, nicht über dem Cap), erzielen ohne
      MC-Filter keine schlechtere reale Strategierendite als die MC-Überlebenden. Untergrenze des KI
      (ungefiltert minus MC-Überlebende) > 0 -> die MC-Gates sind entbehrlich; Obergrenze < 0 -> sie
      tragen Information und bleiben.
    registered_on: "2026-11-09"
    registered_at: "2026-11-09T20:00:00Z"
    start_date: "2026-11-10"
    rule:
      - {field: "features.mismatch", op: ">", value: 0}
    baseline_rule:
      - {field: "features.mismatch", op: ">", value: 0}
      - {not: {field: "reject_reason", op: "in", value: [mc_below_threshold, mc_no_result, mc_invalid_hit_rate,
                                                         final_mc_below_threshold, final_mc_invalid,
                                                         final_mc_zero_prob]}}
    metric: "outcomes.real_strat_ret_45d"
    min_n: 30
    min_clusters: 12
    horizon_days: 45
    max_duration_days: 270
    status: active

  - id: mismatch_directional_news
    # Aktionsplan 2026-11-09, Punkt 4. Produktion: mismatch = impact − 5·|48h-Move|/σ (richtungsblind, relativ
    # zum Scan-Tag). Challenger: mismatch_dir_news = impact − 5·max(0, s·Move seit der ersten Schlagzeile)/σ
    # (modules/mismatch_scorer.py, für JEDE analysierte These notiert, auch Mismatch ≤ 0). Gleiche
    # Population (Deep Analysis, Impact×Surprise-Floor), gleicher Cap 7, gleiche Skalierung.
    hypothesis: >
      Ein gerichteter, an der Nachricht verankerter Mismatch trennt Underreactions besser als der
      richtungsblinde 48h-Mismatch: Thesen mit mismatch_dir_news in (0, 7] erzielen eine höhere reale
      Strategierendite als Thesen mit Produktions-Mismatch in (0, 7].
    registered_on: "2026-11-09"
    registered_at: "2026-11-09T20:00:00Z"
    start_date: "2026-11-10"
    rule:
      - {field: "features.impact", op: ">=", value: 4}
      - {field: "features.surprise", op: ">=", value: 3}
      - {field: "features.mismatch_dir_news", op: ">", value: 0}
      - {field: "features.mismatch_dir_news", op: "<=", value: 7.0}
    baseline_rule:
      - {field: "features.impact", op: ">=", value: 4}
      - {field: "features.surprise", op: ">=", value: 3}
      - {field: "features.mismatch_raw", op: ">", value: 0}
      - {field: "features.mismatch_raw", op: "<=", value: 7.0}
    metric: "outcomes.real_strat_ret_45d"
    min_n: 30
    min_clusters: 12
    horizon_days: 45
    max_duration_days: 270
    status: active
