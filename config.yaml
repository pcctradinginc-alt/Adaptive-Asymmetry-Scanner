# Adaptive Asymmetry-Scanner – Konfiguration v5.0

pipeline:
  confidence_gate: 0.70
  n_simulation_paths: 10000
  simulation_days: 120
  min_impact_threshold: 4    # Legacy-Key, siehe gates.impact_min (dieser gewinnt bei Konflikt)
  max_intraday_move: 0.07    # NEU: 7% → Signal verwerfen wenn zu spät
  max_mismatch: 7.0          # Legacy-Key, siehe gates.mismatch_max (dieser gewinnt bei Konflikt)
  # Laufzeitbudget (Job-Timeout 75 min): ab max_runtime_minutes - finalize_reserve_minutes
  # werden in Stufe 2b/4 keine neuen Kandidaten begonnen (Reject time_budget_exceeded);
  # Report, Ledger und Mail werden immer geschrieben (Testlauf 2026-09-29 brach ohne
  # jede Ausgabe am Job-Timeout ab).
  max_runtime_minutes: 60
  finalize_reserve_minutes: 10

# Zentrale Gate-Schwellen: Pipeline, Mail und Monats-Report lesen ausschließlich
# von hier (mit Fallback auf die Legacy-Keys oben, dann auf den Code-Default).
gates:
  impact_min: 4              # Stufe 4b Impact×Surprise-Floor
  surprise_min: 3
  mismatch_max: 7.0          # Overreaction-Cap: Mismatch > 7 historisch 25% Win, mean −73%
  final_mc_min_short: 0.45   # Final MC, DTE<=45
  final_mc_min_long: 0.50    # Final MC, DTE>45
  trade_score_min: 55        # Stufe 10 Trade-Score-Gate (Pipeline UND Mail)
  shadow_score_min: 40       # darunter nicht mal Schatten-Trade
  final_mc_dte_mode: legacy_45   # legacy_45 = Produktion simuliert 45d (bewusste Baseline im A/B-Test, Challenger final_mc_dte_shadow); ttm = Produktion nutzt ttm_to_dte_floor (120/140d), 45d läuft als Shadow weiter

filters:
  min_market_cap: 2_000_000_000
  min_avg_volume: 1_000_000
  universe: "sp500_nasdaq100"

models:
  prescreener: "claude-haiku-4-5-20251001"
  deep_analysis: "claude-sonnet-4-6"

risk:
  vix_threshold: 35.0
  earnings_buffer_days: 7
  min_open_interest: 100
  max_bid_ask_ratio: 0.10
  max_bear_case_severity: 8

options:
  # DTE-Tiers werden in options_designer.py (DTE_TIERS) gesteuert.
  # time_to_materialization aus deep_analysis bestimmt das DTE-Minimum.
  # v11.0 (2026-07 Monats-Tuning): Floor 45/55 → 120. Datenbefund über 98 dedup.
  # closed_trades: DTE 45–119 = 19% Win / Ø −23.6%, DTE≥120 = 41% Win / Ø +12.7%.
  #   "4-8 Wochen"  → dte_floor=120 (war 45 — Sub-120 blutet aus)
  #   "2-3 Monate"  → dte_floor=120 (war 55)
  #   "6 Monate"    → dte_floor=140 (Long-Term Minimum, Thesis-Matching)
  #   unbekannt     → dte_floor=120 (konservativer Default)
  allow_bearish: false       # Bearish-Trades deaktiviert: 0/6 Wins (LONG_PUT mean −86%)
  bearish_pricing_validated: false  # MC + Put-P&L noch richtungsblind (Review 2026-09-27);
                                    # allow_bearish wirkt erst, wenn hier true (nach Fix)
  delta_target_low:  0.55
  delta_target_high: 0.75
  target_move_pct:   0.10
  min_roi_after_spread: 0.15

# Transaktionskosten (fließen ins ROI-Gate ein)
costs:
  commission_per_contract: 0.65   # $/Kontrakt/Seite (Broker-typisch, z.B. Tradier/IBKR)

# Positionsgrößen-Empfehlung (Fractional Kelly)
portfolio:
  size_usd: 5000             # Depotgröße für Sizing-Empfehlung
  kelly_fraction: 0.25       # ¼-Kelly: konservativ, Standard für Options
  max_position_pct: 0.10     # Hard-Cap: max. 10% des Depots pro Trade
  assumed_loss_pct: 0.80     # Erwarteter Verlust bei Stop-Loss. War 0.45 (= SL-Schwelle),
                             # aber realisierte stop_loss-Exits: Ø −80% / Median −92%
                             # (n=30, 2×-täglicher Check + Gaps). Kelly rechnete zu optimistisch.

learning:
  learning_rate: 0.05
  min_bin_count:  3
  close_after_days: 45         # Geändert: 130 → 45

eps_drift:
  noise_threshold:    0.02
  relevant_threshold: 0.05
  massive_threshold:  0.10

# RL-System
rl:
  enabled: true
  veto_enabled: false           # Option A: PPO-Veto AUS → QuasiML-Ranking.
                                # Grund: Der trainierte PPO-Agent skippte 100% aller
                                # Kandidaten (degenerierte "immer SKIP"-Policy, da der
                                # Trainings-Ledger netto verlustig ist). Erst wieder true,
                                # wenn genug closed_trades unter den neuen Regeln vorliegen
                                # (arm_threshold) und der Reward auf Regret-Shaping umgebaut ist.
  model_path: "outputs/models/ppo_options_agent.zip"
  min_trades_for_training: 3
  timesteps_per_update: 2000
  arm_threshold: 30             # closed_trades (seit arm_since) ab denen eine "RL scharfstellen"-
                                # Email ausgelöst wird (= Phase-1-Validierungsziel)
  arm_since: "2026-06-11"       # Stichtag neue Gates — nur Trades danach zählen fürs Scharfstellen

# FinBERT
finbert:
  enabled: true
  model_name: "ProsusAI/finbert"
  cache_dir: "/tmp/finbert_cache"
  max_headlines: 8
  max_tokens: 128

# Reddit
reddit:
  enabled: true
  subreddits: ["wallstreetbets", "stocks", "investing", "options"]
  max_posts_per_ticker: 50
  time_filter: "day"
  request_delay: 0.5

# Externe API-Quellen
data_sources:

  tradier:
    enabled: true             # false → yfinance Fallback für Option Chains
    base_url: "https://api.tradier.com/v1"
    timeout: 10               # Sekunden pro Request
    # Scope: options_designer.py (Chain + IV-Rank) + feedback.py (P&L-Tracking)
    # Key:   TRADIER_API_KEY als GitHub Secret (nie hier eintragen!)

  alpha_vantage:
    enabled: true             # ALPHA_VANTAGE_API_KEY als Secret
    max_daily_calls: 25       # Free Tier Limit
    eps_tolerance: 0.10       # 10% Abweichung erlaubt

  finnhub:
    enabled: true             # FINNHUB_API_KEY als Secret
    use_for_earnings: true    # Earnings-Gate via Finnhub statt yfinance

  fda:
    enabled: true             # Kein Key nötig
    days_back: 7
    sectors: ["Healthcare", "Biotechnology", "Pharmaceuticals"]

  sec_insider:
    enabled: true             # Kein Key nötig
    days_back: 14
    min_cluster_size: 2       # Mindestens 2 Insider für Cluster-Signal

  flash_alpha:
    enabled: true             # FLASH_ALPHA_API_KEY als Secret
    max_daily_calls: 5        # KRITISCH: Nicht überschreiten!
    top_n: 2                  # Nur für Top-2 Signale

  eulerpool:
    enabled: true             # EULERPOOL_API_KEY als Secret
    top_n: 2                  # Nur für Top-2 Signale
    iv_crush_threshold: 80    # IV-Percentile ab dem Warnung ausgegeben wird

# Multi-Variant Exit-Counterfactual (rein simulativ, siehe modules/exit_sim.py)
exit_sim:
  enabled: true
  trail_pcts: [0.35, 0.50]   # Trailing-Abstand für Varianten C (trail35) / D (trail50)
  activation: 0.50           # Peak-Return, ab dem der Trailing-Stop/Teilverkauf aktiviert wird

# Candidate-Ledger (reine Observability, siehe modules/candidate_ledger.py)
ledger:
  max_option_snapshots: 40   # Obergrenze echter Tradier-Options-Snapshots pro Lauf (API-Call-Budget)

# External-Data Factory (Road/Maritime Freight, Weather, Real Economy) —
# siehe modules/external/. Reine Observability solange mode != production.
external_context:
  enabled: true
  mode: shadow            # off | shadow | challenger | production
  road_freight: {enabled: true}
  maritime: {enabled: true}
  weather:
    enabled: true
    # Erforderlicher NWS-API-Kontakt (api.weather.gov verlangt einen
    # identifizierenden User-Agent). VERIFY: README enthält aktuell keinen
    # offiziellen Kontakt; vor Produktion durch eine echte, erreichbare
    # Adresse/URL des Betreibers ersetzen.
    user_agent_contact: "research@adaptive-asymmetry-scanner.local"
    # NWS-Grid-Prognosen werden je Location/Tag/Metrik AGGREGIERT archiviert
    # (tmax/tmin/tmean/hdd/cdd/precip_total/snow_total/ice_total/pop_max/
    # wind_max/gust_max), nicht mehr stündlich -- siehe modules/external/
    # sources/weather.py: aggregate_daily_forecast. Nur Tage 0..forecast_days-1
    # relativ zum lokalen Issue-Tag der Location.
    forecast_days: 5  # 5 Tage: ~1,5 MB/Lauf unkomprimiert (unter der 2-MB-Volumensperre)
  archive:
    root: outputs/external_data
    raw_payload_policy: hash_only    # hash_only (Default) | gzip
    raw_max_bytes: 2000000           # Nur bis zu dieser Größe wird bei "gzip" der Payload gespeichert
    storage_warn_mb_1y: 200          # 1y-Speicherprojektion über dieser Schwelle → Warnung/Migrationshinweis
    # Volumen-Guard: übersteigen die NEUEN normalisierten Zeilen EINER Quelle
    # in einem Run diese Bytegrenze, wird für diese Quelle in diesem Run
    # NICHTS geschrieben (nie stillschweigend gekürzt) -- Status WARN,
    # Meldung "volume guard", Alarmierung über den bestehenden Mechanismus.
    max_new_normalized_bytes_per_source_per_run: 2000000
    max_backfill_bytes_per_source: 30000000   # einmaliger historischer Erstimport je Quelle
    # Optionales Object-Storage-Backend (siehe modules/external/storage.py).
    # "git" (Default) = heutiges Verhalten, NIE Löschung. "s3" aktiviert
    # Upload+Retention -- Zugangsdaten/Bucket AUSSCHLIESSLICH über Env-Vars
    # (EXTERNAL_ARCHIVE_S3_BUCKET/_ENDPOINT/_PREFIX, AWS_ACCESS_KEY_ID/
    # AWS_SECRET_ACCESS_KEY/AWS_REGION), nie hier in config.yaml. Ohne
    # EXTERNAL_ARCHIVE_S3_BUCKET bleibt "s3" wirkungslos (WARN, keine Löschung).
    backend: git                     # git (Default) | s3
    git_retention_months: 3          # nur abgeschlossene, verifiziert hochgeladene normalisierte Monate älter als N Monate werden lokal gelöscht
  readiness:
    # Methodologische Mindestschwellen je Frequenz für EXPLORATORY_READY /
    # CHALLENGER_READY — NIE aus Returns abgeleitet (siehe registry.py).
    daily:   {exploratory_min_obs: 60, exploratory_min_days: 90, challenger_min_obs: 250, challenger_min_days: 365}
    monthly: {exploratory_min_obs: 24, exploratory_min_days: 0,  challenger_min_obs: 60,  challenger_min_days: 0}
    event:   {exploratory_min_obs: 20, exploratory_min_days: 0,  challenger_min_obs: 50,  challenger_min_days: 0}
  states:
    strong: 1.5             # |z| >= strong → STRONG_EXPANSION/STRONG_CONTRACTION
    normal: 0.5              # |z| >= normal → EXPANSION/CONTRACTION
    z_window_days: 365
  research:
    enable_hypothesis_generation: true
    max_external_hypotheses_per_month: 3
  production:
    max_score_delta: 0
  alerts:
    email: true
  learning:
    promoted_external_features: []   # Erst nach Challenger-Validierung + gemergtem PR befüllen
  shadow_analysis:
    # Separater, read-only LLM-Call (siehe modules/external/shadow_analysis.py):
    # bewertet NUR, ob der externe Kontext zur bereits produktiv erzeugten
    # Deep-Analysis-These passt. Verändert NIE Prompt/Ergebnis der Produktions-
    # Deep-Analysis. Wird übersprungen wenn mode==off, kein API-Key oder zu
    # wenig verifizierte Eingabedaten vorliegen.
    enabled: true
    model: null              # null -> models.prescreener wiederverwendet
    max_candidates_per_run: 25

# RL-Feature-Schema für externe Signale (siehe modules/external/features.py)
learning_features:
  production: [impact, mismatch, eps_drift]
  shadow: []           # externe Features werden von den Integrationsschritten ergänzt
rl_feature_schema_version: v1
