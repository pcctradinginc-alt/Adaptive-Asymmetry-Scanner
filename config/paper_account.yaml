# Separate virtual account policy; changes after activation require a reviewed migration.
# Does not affect scanner sizing or any production risk gate.
version: github-paper-account-v1
enabled: true
starting_cash_usd: 100000
max_position_risk_fraction: 0.02
max_total_open_risk_fraction: 0.15
max_ticker_open_risk_fraction: 0.05
max_decision_age_seconds: 900
strategy_preference: [LONG_CALL, BULL_CALL_SPREAD]
comparison_group: TREATMENT
broker_connection: NONE
real_orders: false
production_influence: NONE
