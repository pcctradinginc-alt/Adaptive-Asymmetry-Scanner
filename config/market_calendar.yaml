# config/market_calendar.yaml – außerplanmäßige NYSE-/Nasdaq-Abweichungen vom regelbasierten Kalender
# (modules/market_snapshot.nyse_holidays / nyse_early_closes). Regelfeiertage, Good Friday, Juneteenth und die
# regulären verkürzten Sitzungen (3. Juli, Tag nach Thanksgiving, Heiligabend) berechnet der Code selbst.
#
# Hier NUR offiziell von der NYSE angekündigte Sonderfälle eintragen (Staatstrauer, Notfallschließungen,
# zusätzliche verkürzte Sitzungen), jeweils mit Quelle. Nie spekulativ. Datei fehlt/defekt -> nur Regelkalender
# (Warnung im Log). Gilt für Scanner-Guard, Options-Capture, Marks, Session-Klassifikation und Monitoring.
closures:                       # ganztägig geschlossen (YYYY-MM-DD)
  - "2012-10-29"                # Hurrikan Sandy
  - "2012-10-30"                # Hurrikan Sandy
  - "2018-12-05"                # Staatstrauer George H. W. Bush
  - "2025-01-09"                # Staatstrauer Jimmy Carter
early_closes: {}                # zusätzliche verkürzte Sitzungen: {"YYYY-MM-DD": "HH:MM"} (Schlusszeit New York)

# Instrumentenspezifische Handelszeiten (Optionen). Standard: Aktienoptionen 09:30–16:00 ET (an verkürzten Tagen bis
# 13:00 ET). Die folgenden Optionsklassen schließen 15 Minuten später (Cboe: 16:15 ET, an verkürzten Tagen 13:15 ET).
# Nur sicher bekannte Wurzeln eintragen – eine fehlende Wurzel ist konservativ (Quotes nach 16:00 gelten als POST),
# eine falsche wäre es nicht.
instrument_sessions:
  late_close_minutes: 15
  late_close_roots: [SPY, QQQ, IWM, SPX, SPXW, XSP, NDX, NDXP, RUT, RUTW, VIX, VIXW]
