# Alpha-to-Options prospective validation (Phase C). RESEARCH ONLY.
#
# A plan is preregistered (create-only, hashed) for a hypothesis version and the
# structure Phase B proposed, BEFORE any of its validation data exists: only
# signals dated after the registration day count. Looks, look alphas, coverage,
# minimum sample, stop/falsification rules and the error-budget slot are fixed
# in the plan. The best possible outcome is QUALIFIED_FOR_HUMAN_REVIEW - never
# an automatic trade, promotion or production change.
version: alpha-option-validation-v1
enabled: true
production_influence: NONE
allow_llm: false
# Target: per-signal net return on equal budget, ADVERSE execution, ABSTAIN = 0.
target: PER_SIGNAL_NET_RETURN_EQUAL_BUDGET_ADVERSE
# All must hold at the same look alpha (intersection-union test), each on
# contemporaneously observed, comparable data with enough common independent
# periods; missing comparison data never confirm. RANDOM_CONTROL is the
# identical rule on random names (NOT the existing base strategy);
# FROZEN_ML_BENCHMARK is the frozen registry benchmark model (not required when
# the hypothesis is the benchmark itself). The existing scanner/option_learner
# base strategy is reported descriptively only (different population and
# holding horizon) and never used for a superiority claim.
comparisons: [NO_TRADE, RANDOM_CONTROL, FROZEN_ML_BENCHMARK]
max_days: 364                      # looks at 1/3, 2/3 and 1 of max_days (option_learner.look_days)
min_decision_coverage: 0.9
min_quote_coverage: 0.8
min_verified_outcomes: 30
min_independent_periods: 8          # non-overlapping 28-day holding windows
concentration:
  max_top_ticker_share: 0.25
  max_top_date_share: 0.35
stability:
  min_bucket_n: 5                  # regime buckets and time-cohort halves with >= n must be positive
# Permanent error budget (same mechanism as option_learner.test_budget): one
# Bonferroni slot per registered plan, spent over the looks by O'Brien-Fleming.
test_budget:
  total_alpha: 0.05
  max_tests: 20
learning:
  max_suggested_hypotheses: 3      # suggestions only; registration stays in the explorer budget
  min_regime_n: 10
