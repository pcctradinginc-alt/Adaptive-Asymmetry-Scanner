  source_id: nasdaq100_members
  display_name: 'Nasdaq-100: offizielle Mitgliederliste (tägliche PIT-Momentaufnahme)'
  authority: Nasdaq, Inc. (nasdaq.com)
  official_homepage: https://www.nasdaq.com/market-activity/quotes/nasdaq-ndx-index
  machine_endpoint: https://api.nasdaq.com/api/quote/list-type/nasdaq100
  access_method: https_json
  license_reference: nasdaq.com Website-Daten; nur Mitgliederliste (Symbole) für Research, keine Kursdaten
  frequency: daily
  expected_update_cadence: P1D
  max_staleness_days: 5
  pit_quality: EXACT_TIMESTAMP
  max_fetch_seconds: 60
  notes: 'A4: Wikipedia bleibt Primärquelle des UNIVERSE_V1 (unverändert); diese Liste ist Fallback vor der statischen Liste
    und baut ab jetzt die fehlende PIT-Mitgliederhistorie auf (ein Snapshot je Tag, Symbole in attrs).'
  cost: kostenlos, ohne Key
  commercial_use_status_if_known: siehe license_reference
  attribution: 'Source: Nasdaq, Inc. (nasdaq.com)'
  failure_behavior: Quelle fehlt/veraltet -> abhängige Research-Kennzahlen unavailable (nie 0, nie Produktionswirkung)
