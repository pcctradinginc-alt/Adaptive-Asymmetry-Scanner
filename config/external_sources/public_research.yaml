  source_id: fomc_calendar
  display_name: FOMC-Sitzungskalender (Federal Reserve)
  authority: Board of Governors of the Federal Reserve System
  official_homepage: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  machine_endpoint: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  access_method: https_html
  license_reference: US Government Work (gemeinfrei)
  frequency: weekly
  expected_update_cadence: P7D
  max_staleness_days: 14
  pit_quality: EXACT_TIMESTAMP
  # Termine liegen per Definition in der Zukunft (observation_time = geplanter Zeitpunkt, available_at = Abruf):
  # angekündigte Termine sind kein FUTURE_OBSERVATION-Befund – aber nur bis max_future_days (Konnektor-Fenster 400 T
  # + 10 T Toleranz); weiter entfernte Zeitpunkte bleiben ein Befund. Echte PIT-Prüfung: Orchestrator.
  allow_future_observations: true
  max_future_days: 410
  max_fetch_seconds: 60
  notes: 'B7: Entscheid = letzter Sitzungstag 14:00 New York; value 2 = mit Projektionen (SEP).'
  cost: kostenlos
  commercial_use_status_if_known: siehe license_reference
  attribution: 'Source: Board of Governors of the Federal Reserve System'
  failure_behavior: Quelle fehlt/veraltet -> abhängige Research-Kennzahlen unavailable (nie 0, nie Produktionswirkung)
