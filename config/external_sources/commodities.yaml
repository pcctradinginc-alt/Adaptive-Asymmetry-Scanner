    access_method: "eia_api_v2"
    requires_auth: true
    auth_env_variable: "EIA_API_KEY"
    auth_optional: true
    license_reference: "EIA Copyrights and Reuse: US Government Works, gemeinfrei (Quellenangabe erbeten)"
    license_status: OK
    commercial_use_status_if_known: "gemeinfrei"
    attribution: "Source: U.S. Energy Information Administration"
    frequency: weekly
    expected_update_cadence: "P7D"
    max_staleness_days: 16
    supports_history: true
    supports_vintages: false
    supports_release_time: false
    pit_quality: CONSERVATIVE_DATE
    enabled: true
    criticality: low
    role: RESEARCH_SHADOW
    research_only: true          # Ausfall -> nur abhängige Features unavailable, nie globaler Safe Mode
    max_fetch_seconds: 300
    max_backfill_bytes: 15000000
    plausible_ranges:
      eia_natgas_storage: [500, 4500]              # Bcf, Lower 48
      eia_henry_hub_spot: [0.5, 50]                # USD/MMBtu (Live 2026-01-23: 30,72 real)
      eia_dry_gas_production: [1500000, 4000000]   # MMcf je Monat
      eia_lng_exports: [0, 600000]                 # MMcf je Monat
    retrieval_frequency: "täglich geprüft; Abruf nur bei fälligem Release (is_due)"
    expected_latency: "Speicher: Wochenende Fr -> Do 10:30 ET, Regel Fr+7 T; Monatswerte ~2 Monate, Regel Monatsbeginn+100 T"
    revision_policy: "Monatswerte werden revidiert: Erstimport = heutiger Stand (backfill_latest_vintage), danach Revisionen ab Abruf"
    historical_depth: "2015–heute"
    failure_behavior: "Serie fehlt/Einheit geändert -> Feature UNAVAILABLE (nie 0)"
    point_in_time_capable: true
    entity_level: "USA (Lower 48 / gesamt)"
    coverage: "Arbeitsgas im Speicher (wöchentlich), Henry Hub (Crosscheck), Trockengas-Produktion und LNG-Exporte (monatlich)"
    rate_limits: "EIA: ca. 5000 Anfragen/Stunde je Key; Abruf nur bei fälligem Release"
    cost: "kostenlos (API-Key)"
    revision_risk: medium
    maintenance_cost: low
    semantics:
      measures: "US-Gasbilanz (Speicher, Angebot, Export)"
      geography: "USA"
      latency: "Speicher 6 T; Monatswerte ~2 Monate"
      sectors: "Gasproduzenten, Chemie, Dünger, Versorger"
      mechanisms: ["Speicherabweichung vom 5J-Mittel als Preisdruck", "LNG-Exporte als Nachfragekanal"]

  - source_id: fred_commodities
    display_name: "FRED/ALFRED Rohstoffpreise: Brent, Henry Hub, Kupfer, Weizen, Mais, Sojabohnen"
    family: commodities
    authority: "FRED/ALFRED (St. Louis Fed); Originale: EIA (Brent, Henry Hub), IMF Primary Commodity Prices (Metalle/Agrar)"
    official_homepage: "https://fred.stlouisfed.org"
    machine_endpoint: "https://api.stlouisfed.org/fred/series/observations"
    access_method: "fred_alfred_api"
    requires_auth: true
    auth_env_variable: "FRED_API_KEY"         # GitHub-Secret FRED_API_KEY oder FRED_KEY
    auth_optional: true
    license_reference: "FRED ToU; EIA gemeinfrei; IMF Primary Commodity Prices frei mit Quellenangabe"
    license_status: OK
    commercial_use_status_if_known: "frei mit Quellenangabe; LBMA Gold/Silber bewusst NICHT (aus FRED entfernt, Lizenz)"
    attribution: "Source: FRED/ALFRED, Federal Reserve Bank of St. Louis; EIA; IMF"
    frequency: daily
    expected_update_cadence: "P1D"
    max_staleness_days: 21
    supports_history: true
    supports_vintages: true
    supports_release_time: true
    pit_quality: EXACT_DATE
    enabled: true
    criticality: low
    role: RESEARCH_SHADOW
    research_only: true          # Ausfall -> nur abhängige Features unavailable, nie globaler Safe Mode
    max_backfill_bytes: 20000000
    plausible_ranges:
      brent: [5, 250]
      henry_hub: [0.5, 50]          # Live 2026-01-23: 30,72 real; 0,0-Vintages = ungültig (Feature-Engine)
      copper: [1000, 20000]
      wheat: [50, 1000]
      corn: [50, 800]
      soybeans: [100, 1200]
    expected_series_ids:
      DCOILBRENTEU: "DCOILBRENTEU"
      DHHNGSP: "DHHNGSP"
      PCOPPUSDM: "PCOPPUSDM"
      PWHEAMTUSDM: "PWHEAMTUSDM"
      PMAIZMTUSDM: "PMAIZMTUSDM"
      PSOYBUSDM: "PSOYBUSDM"
    notes: >
      WTI kommt aus fred_regime_macro (DCOILWTICO) und wird wiederverwendet. Gold/Silber:
      keine offizielle kostenlose Reihe -> UNAVAILABLE (Preisfeatures), COT-Positionierung bleibt.
    retrieval_frequency: "täglich (6 ALFRED-Abrufe)"
    expected_latency: "täglich bis wöchentlich (EIA-Spots), monatlich (IMF-Preise, Anfang Folgemonat)"
    revision_policy: "ALFRED-Vintages: available_at = realtime_start, Revisionen als eigene Vintages"
    historical_depth: "2015–heute"
    entity_level: "Weltmarktpreis je Rohstoff"
    coverage: "Brent, Henry Hub (täglich); Kupfer, Weizen, Mais, Sojabohnen (monatlich); Gold/Silber UNAVAILABLE"
    rate_limits: "FRED: 120 Anfragen/Minute je Key"
    cost: "kostenlos (API-Key)"
    failure_behavior: "Serie fehlt -> Preis-Features dieses Rohstoffs UNAVAILABLE (nie 0)"
    point_in_time_capable: true
    revision_risk: low
    maintenance_cost: low
    semantics:
      measures: "Rohstoffpreise (Spot bzw. Monatsdurchschnitt)"
      geography: "Weltmarkt / USA (Henry Hub)"
      latency: "1–7 T (täglich), ~5 T nach Monatsende (monatlich)"
      sectors: "Energie, Grundstoffe, Agrar, Industrie (Inputkosten)"
      mechanisms: ["Rohstoffpreis -> Erlöse/Kosten exponierter Unternehmen", "verzögerte Anpassung von Analystenschätzungen"]

