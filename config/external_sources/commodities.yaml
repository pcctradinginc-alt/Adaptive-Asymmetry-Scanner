# config/external_sources/commodities.yaml – Commodity Intelligence (RESEARCH/SHADOW)
#
# Serien, Release-Regeln, COT-Mapping und Qualitätsgrenzen: config/commodity_intelligence.yaml.
# Konnektoren: modules/external/sources/commodities.py. Features: modules/commodity_intelligence.py.
# Nur offizielle, kostenlose Quellen (US Government Works, gemeinfrei). Keine Produktionswirkung.
sources:

  - source_id: eia_petroleum_weekly
    display_name: "EIA Open Data v2: Weekly Petroleum Status Report (Bestände, Produktion, Handel, Raffinerien) + Ölspots"
    family: commodities
    authority: "U.S. Energy Information Administration (EIA)"
    official_homepage: "https://www.eia.gov/opendata/"
    machine_endpoint: "https://api.eia.gov/v2/petroleum/sum/sndw/data/"
    access_method: "eia_api_v2"
    requires_auth: true
    auth_env_variable: "EIA_API_KEY"          # GitHub-Secret EIA_KEY
    auth_optional: true
    license_reference: "EIA Copyrights and Reuse: US Government Works, gemeinfrei (Quellenangabe erbeten)"
    license_status: OK
    commercial_use_status_if_known: "gemeinfrei"
    attribution: "Source: U.S. Energy Information Administration"
    frequency: weekly
    expected_update_cadence: "P7D"
    max_staleness_days: 16
    supports_history: true
    supports_vintages: false
    supports_release_time: false
    pit_quality: CONSERVATIVE_DATE
    enabled: true
    criticality: low
    role: RESEARCH_SHADOW
    research_only: true          # Ausfall -> nur abhängige Features unavailable, nie globaler Safe Mode
    max_fetch_seconds: 300
    max_backfill_bytes: 25000000
    plausible_ranges:
      eia_crude_stocks: [200000, 700000]          # Tsd. Barrel (ohne SPR)
      eia_crude_production: [3000, 16000]         # Tsd. Barrel/Tag
      eia_crude_imports: [2000, 12000]
      eia_crude_exports: [0, 7000]
      eia_refinery_utilization: [40, 100]         # Prozent
      eia_product_supplied: [10000, 25000]
      eia_gasoline_stocks: [150000, 300000]
      eia_distillate_stocks: [80000, 200000]
      eia_wti_spot: [-50, 250]
      eia_brent_spot: [5, 250]
    retrieval_frequency: "täglich geprüft; Abruf nur, wenn ein neuer Wochenbericht fällig ist (is_due)"
    expected_latency: "Wochenende Fr -> Release Mi 10:30 ET (Feiertage Do); Regel Fr+6 T 16:00 UTC"
    revision_policy: "Wochenwerte praktisch unrevidiert; spätere Änderungen gelten erst ab Abruf"
    historical_depth: "2015–heute"
    failure_behavior: "Serie fehlt/Einheit geändert -> Feature UNAVAILABLE (nie 0)"
    point_in_time_capable: true
    notes: >
      available_at = min(Regel, retrieved_at). Spots (RWTC/RBRTE) nur Crosscheck gegen FRED,
      EIA aktualisiert Tages-Spots wöchentlich (Regel Tag+9).
    entity_level: "USA gesamt (Serie je Größe)"
    coverage: "Rohöl-/Produktbestände, Produktion, Importe, Exporte, Raffinerieauslastung, Product Supplied; WTI/Brent-Spot (Crosscheck)"
    rate_limits: "EIA: ca. 5000 Anfragen/Stunde je Key; Abruf nur bei fälligem Release"
    cost: "kostenlos (API-Key)"
    revision_risk: low
    maintenance_cost: low
    semantics:
      measures: "physische Öl-Bilanz der USA (Bestände, Angebot, implizite Nachfrage)"
      geography: "USA"
      latency: "5 T nach Wochenende (Mi)"
      sectors: "Energie, Raffinerien, Transport/Airlines (Verbraucher)"
      mechanisms: ["Lagerabweichung vom saisonalen Mittel als Preisdruck", "Nachfrage (Product Supplied) vor Preis"]

