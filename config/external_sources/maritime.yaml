# config/external_sources/maritime.yaml
#
# Registry-Einträge für die Maritime-Datenfamilie (IMF PortWatch). Gleiches
# Feld-Set wie andere externe Datenfamilien. `machine_endpoint` ist absichtlich
# leer/optional: die tatsächlichen ArcGIS-FeatureServer-URLs werden zur
# Laufzeit über die ArcGIS-Sharing-Search-API entdeckt (siehe
# modules/external/sources/maritime.py::discover_endpoints) und unter
# outputs/external_data/manifests/portwatch_endpoints.json gecached. Ein hier
# gesetzter machine_endpoint überschreibt die Discovery, wird aber als
# "verify in preflight" markiert, weil er ungeprüft übernommen wird.
#
# LIZENZ-ENTSCHEIDUNG (menschlich, 2026-09-27, Repo-Owner): Nutzung
# ausschließlich PRIVAT und NICHT-KOMMERZIELL als Research-Tool. Grundlage:
# IMF Copyright and Terms (https://www.imf.org/en/about/copyright-and-terms,
# verlinkt von portwatch.imf.org): Daten dürfen heruntergeladen, kopiert,
# weiterverarbeitet und genutzt werden – mit Quellenangabe, ohne Verfälschung,
# wesentliche Umformungen kenntlich gemacht. Kommerzielle Wiederverwendung
# erfordert eine Genehmigung (copyright@imf.org) – bei jeder Änderung des
# Nutzungszwecks (z.B. Signalverkauf, Fonds, kommerzielles Angebot) MUSS
# license_status zurück auf REVIEW_REQUIRED und die Genehmigung eingeholt werden.
# Pflicht-Attribution in Reports: "Source: International Monetary Fund,
# IMF PortWatch (portwatch.imf.org); derived/aggregated by this project."

sources:
  - source_id: imf_portwatch_ports
    display_name: "IMF PortWatch – Daily Ports Data"
    max_fetch_seconds: 600   # ~260 Seiten Paginierung; Standard 300s (orchestrator)
    # Volumen-Guard je Lauf, bemessen am natürlichen Volumen: 21-Tage-Fenster × ~800 Beob./Tag
    # × ~630 B ≈ 10,6 MB. Der globale Standard (2 MB) erzeugte einen Deadlock: nach 3 Tagen
    # Rückstand blockierte der Guard jeden Lauf, der Rückstand wuchs (Archiv stand 09-18..10-03).
    max_new_normalized_bytes_per_run: 12000000
    family: maritime
    authority: "IMF PortWatch (IMF & University of Oxford)"
    official_homepage: "https://portwatch.imf.org"
    machine_endpoint: null  # discovered at runtime; verify in preflight if overridden
    access_method: "ArcGIS FeatureServer REST (query)"
    requires_auth: false
    auth_env_variable: null
    license_reference: "IMF Copyright and Terms (imf.org/en/about/copyright-and-terms): Nutzung mit Attribution; kommerzielle Wiederverwendung genehmigungspflichtig"
    license_status: OK
    usage_restriction: "private, non-commercial research only"
    commercial_use_status_if_known: "requires permission (copyright@imf.org)"
    attribution: "Source: International Monetary Fund, IMF PortWatch (portwatch.imf.org); derived/aggregated by this project."
    frequency: daily
    expected_update_cadence: 7d
    supports_history: true
    supports_vintages: false
    supports_release_time: false
    pit_quality: CONSERVATIVE_DATE
    enabled: true
    criticality: medium

  - source_id: imf_portwatch_chokepoints
    display_name: "IMF PortWatch – Daily Chokepoints Data"
    family: maritime
    authority: "IMF PortWatch (IMF & University of Oxford)"
    official_homepage: "https://portwatch.imf.org"
    machine_endpoint: null  # discovered at runtime; verify in preflight if overridden
    access_method: "ArcGIS FeatureServer REST (query)"
    requires_auth: false
    auth_env_variable: null
    license_reference: "IMF Copyright and Terms (imf.org/en/about/copyright-and-terms): Nutzung mit Attribution; kommerzielle Wiederverwendung genehmigungspflichtig"
    license_status: OK
    usage_restriction: "private, non-commercial research only"
    commercial_use_status_if_known: "requires permission (copyright@imf.org)"
    attribution: "Source: International Monetary Fund, IMF PortWatch (portwatch.imf.org); derived/aggregated by this project."
    frequency: daily
    expected_update_cadence: 7d
    supports_history: true
    supports_vintages: false
    supports_release_time: false
    pit_quality: CONSERVATIVE_DATE
    enabled: true
    criticality: medium

  - source_id: imf_portwatch_disruptions
    display_name: "IMF PortWatch – Disruption Monitor (Störungsereignisse mit betroffenen Häfen)"
    family: maritime
    authority: "IMF PortWatch (IMF & University of Oxford), Ereignisse u. a. aus GDACS"
    official_homepage: "https://portwatch.imf.org/pages/disruption-monitor"
    machine_endpoint: "https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/portwatch_disruptions_database/FeatureServer/0"
    access_method: "ArcGIS FeatureServer REST (query)"
    requires_auth: false
    auth_env_variable: null
    license_reference: "IMF Copyright and Terms (imf.org/en/about/copyright-and-terms): Nutzung mit Attribution; kommerzielle Wiederverwendung genehmigungspflichtig"
    license_status: OK
    usage_restriction: "private, non-commercial research only"
    commercial_use_status_if_known: "requires permission (copyright@imf.org)"
    attribution: "Source: International Monetary Fund, IMF PortWatch (portwatch.imf.org); derived/aggregated by this project."
    frequency: event
    may_be_empty: true   # keine Ereignisse = legitim leer (Data-Quality-Gate EMPTY_RESULT)
    expected_update_cadence: 60d  # Ereignisquelle: Beginn des jüngsten Ereignisses, keine Tageswerte
    supports_history: true
    supports_vintages: false
    supports_release_time: false
    pit_quality: CONSERVATIVE_DATE
    enabled: true
    criticality: low
    notes: >
      Schema live geprüft 2026-09-28 (source_discovery layer_schemas): 132
      Ereignisse seit 2019, Felder eventid/eventtype/alertlevel/fromdate/
      todate/affectedports. available_at = Abrufzeit (Ereignisdatum nie als
      Verfügbarkeit); Verlängerungen erzeugen neue Vintages (disruption_end_ts).

