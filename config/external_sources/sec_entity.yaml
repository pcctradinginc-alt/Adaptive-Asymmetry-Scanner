  - source_id: sec_companyfacts
    display_name: "SEC XBRL companyfacts (Fundamentaldaten je Filing, PIT)"
    family: alternative_sec
    authority: "U.S. Securities and Exchange Commission"
    official_homepage: "https://www.sec.gov/search-filings/edgar-application-programming-interfaces"
