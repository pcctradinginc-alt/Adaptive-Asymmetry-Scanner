# config/external_sources/sec_entity.yaml – Data Source Contracts (Alternative Data, Phase 1)
#
# Abgerufen NICHT vom generischen Orchestrator, sondern von eigenen,
# budgetierten Jobs (.github/workflows/alt_data.yml):
#   modules/entity_resolution/build.py   (GLEIF, SEC-Entitäten)
#   modules/external/sources/sec_ingest.py (Form 3/4/5, Submissions)
# status_override sorgt dafür, dass der Orchestrator sie sichtbar überspringt
# (DEFERRED), statt Fehler zu zählen. Health: outputs/external_data/sec/health.json
# und outputs/entity/entity_report.json.
#
# Zusatzfelder je Vertrag (Auftrag "Data Source Contract"): retrieval_frequency,
# expected_latency, revision_policy, historical_depth, entity_level, coverage,
# rate_limits, cost, failure_behavior, point_in_time_capable.

sources:

  - source_id: sec_form345
    display_name: "SEC Insider Transactions Data Sets (Form 3/4/5, vierteljährlich)"
    family: alternative_sec
    authority: "U.S. Securities and Exchange Commission (DERA)"
    official_homepage: "https://www.sec.gov/data-research/sec-markets-data/insider-transactions-data-sets"
    machine_endpoint: "https://www.sec.gov/files/structureddata/data/form-345-data-sets/{YYYY}q{Q}_form345.zip"
    access_method: "quarterly_zip_tsv"
    requires_auth: false
    auth_env_variable: ""
    license_reference: "US-Bundesbehörde, gemeinfrei (17 U.S.C. § 105); SEC Fair Access (<= 10 Anfragen/s, User-Agent mit Kontakt)"
    commercial_use_status_if_known: "erlaubt"
    frequency: quarterly
    expected_update_cadence: "P3M"
    supports_history: true
    supports_vintages: false
    supports_release_time: true
    pit_quality: CONSERVATIVE_DATE
    enabled: true
    status_override: "OWN_WORKFLOW:alt_data.yml"
    criticality: low
    license_status: OK
    role: RESEARCH_SHADOW
    retrieval_frequency: "wöchentlich (neues Quartal ~30 T nach Quartalsende)"
    expected_latency: "Filing-Datum + 1 Tag (konservativ); Quartals-ZIP ca. 1 Monat nach Quartalsende"
    revision_policy: "keine Revisionen; Korrekturen als eigene /A-Filings – nur Original-Form-4 werden gezählt"
    historical_depth: "2006–heute (genutzt ab 2014)"
    entity_level: "Emittent (CIK) × meldende Person"
    coverage: "alle Form-4-pflichtigen Emittenten (Universum über Entity-Map)"
    rate_limits: "10 Anfragen/s"
    cost: "kostenlos"
    failure_behavior: "Quartal fehlt -> Abdeckung endet davor; Insider-Features NaN, nie 0"
    point_in_time_capable: true
    revision_risk: low
    maintenance_cost: low
    semantics:
      measures: "Open-Market-Käufe/-Verkäufe von Insidern (Form 4)"
      geography: "USA-Emittenten"
      latency: "2 Geschäftstage nach Transaktion"
      sectors: "alle"
      mechanisms: ["private Information der Insider", "Signalwirkung von Käufen auf eigenes Geld"]

