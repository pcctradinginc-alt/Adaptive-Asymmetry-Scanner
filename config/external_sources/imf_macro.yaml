# Eight IMF statistical research sources, deliberately separate from PortWatch.
# All code paths are prospective PIT snapshots: NO reconstructed historic vintages.
# Official IMF Data terms: https://www.imf.org/en/about/copyright-and-terms
# IMF statistical data may be reused with attribution; potential commercial
# use requires contacting copyright@imf.org. No LLM training, no bulk crawl.
# Study-only: not registered as option-learner/model production features.
sources:
  - source_id: imf_fsi
    display_name: "IMF – Financial Soundness Indicators (FSIC)"
    family: imf_macro
    authority: "International Monetary Fund (IMF)"
    official_homepage: "https://data.imf.org"
    machine_endpoint: "https://api.imf.org/external/sdmx/2.1/data/FSIC"
    access_method: "IMF SDMX-ML 2.1, DSD-verified bounded series"
    requires_auth: false
    auth_env_variable: ""
    license_reference: "IMF statistical Data usage: https://www.imf.org/en/about/copyright-and-terms"
    license_status: OK
    usage_restriction: "Private, noncommercial statistical research only; no commercial downstream use without IMF clearance; NO LLM training"
    commercial_use_status_if_known: "Contact copyright@imf.org for permission"
    attribution: "Source: International Monetary Fund, Financial Soundness Indicators (FSIC), https://data.imf.org; research transformations disclosed"
    frequency: quarterly
    expected_update_cadence: "P3M"
    max_staleness_days: 220
    min_refetch_days: 14
    max_fetch_seconds: 160
    max_new_normalized_bytes_per_run: 2500000
    supports_history: true
    supports_vintages: false
    supports_release_time: false
    pit_quality: CONSERVATIVE_DATE
    enabled: true
    criticality: low
    research_only: true
    run_only_by_family: true
    production_promotion_allowed: false
    dataflow: "FSIC"
    notes: "Do not backdate availability to observation_time; official history is NOT point-in-time verified. Treat missing schema or invalid field mapping as SCHEMA_CHANGED."

