# config/data_catalog.yaml – Kandidaten-Datenquellen für Active Learning
#
# Kuratiert, NICHT vertrauenswürdig per se: Jede Quelle durchläuft vor Nutzung
# die Aufnahmeprüfung (modules/research_director.py -> onboarding_checklist):
# provenance, historical coverage, timestamp integrity, revision analysis,
# missing-data analysis, leakage audit, incremental OOS test.
# Kosten: 1 = frei/offizielle API, 3 = Aufwand/Registrierung, 5 = kommerziell.

sources:
  - id: alfred_payems_icsa_rsafs_isratio
    dimension: [labour_market, consumer_demand, inventories]
    provider: "FRED/ALFRED (BLS, DOL, Census)"
    license: "US Government Works (gemeinfrei)"
    pit: vintages
    history_from: 2015
    acquisition_cost: 1
    status: integrated          # fred_world_macro
    registry_source_ids: [fred_world_macro]
  - id: earnings_calendar_history
    dimension: [event_risk, earnings_momentum]
    provider: "SEC EDGAR 8-K Item 2.02 (Ergebnis-Veröffentlichungen, Filing-Zeitstempel)"
    license: "gemeinfrei (US Government)"
    pit: filing_timestamp
    history_from: 2004
    acquisition_cost: 3
    status: candidate
  - id: ibes_estimate_revisions
    dimension: [earnings_momentum]
    provider: "Refinitiv I/B/E/S (kommerziell)"
    license: "kommerziell, REVIEW_REQUIRED"
    pit: vintages
    history_from: 1980
    acquisition_cost: 5
    status: candidate
  - id: sec_financial_statements
    dimension: [earnings_momentum, fundamentals]
    provider: "SEC EDGAR XBRL Financial Statement Data Sets (Filing-Datum)"
    license: "gemeinfrei (US Government)"
    pit: filing_timestamp
    history_from: 2009
    acquisition_cost: 3
    status: candidate
  - id: finra_short_interest
    dimension: [positioning]
    provider: "FINRA Equity Short Interest (zweimal monatlich, Veröffentlichungsdatum)"
    license: "frei mit Quellenangabe (Nutzungsbedingungen prüfen: REVIEW_REQUIRED)"
    pit: publication_date
    history_from: 2018
    acquisition_cost: 3
    status: candidate
    registry_source_ids: [finra_short_interest]   # läuft seit 15.10. im Archiv (public_research.yaml)
  - id: cboe_put_call
    dimension: [positioning, risk_appetite]
    provider: "Cboe Market Statistics (täglich)"
    license: "Nutzungsbedingungen prüfen: REVIEW_REQUIRED"
    pit: daily_close
    history_from: 2006
    acquisition_cost: 3
    status: candidate
  - id: portwatch_history_pit
    dimension: [freight_supply_chain]
    provider: "IMF PortWatch (tägliche Archivierung seit 2026-09)"
    license: "IMF Terms (frei mit Quellenangabe)"
    pit: forward_archive_only
    history_from: 2026
    acquisition_cost: 1
    status: accumulating        # historisch nicht PIT (available_at = Abrufdatum)
    registry_source_ids: [imf_portwatch_ports, imf_portwatch_chokepoints]
  - id: destatis_truck_toll_pit
    dimension: [freight_supply_chain, industrial_activity]
    provider: "Destatis LKW-Maut-Fahrleistungsindex"
    license: "DL-DE-BY-2.0"
    pit: forward_archive_only
    history_from: 2026
    acquisition_cost: 1
    status: accumulating
    registry_source_ids: [destatis_truck_toll]
  # ── Kandidaten aus dem Quellen-Audit 2026-11-06 (docs/DATA_SOURCE_DISCOVERY_2026-11-06.md) ───────────────────
  # Zugang aus der Entwicklungsumgebung NICHT prüfbar (Proxy), Lizenz/Limits nur aus Sekundärquellen belegt:
  # access_verified: false und REVIEW_REQUIRED, bis ein Mensch die offiziellen Bedingungen bestätigt und ein
  # read-only-Abruf aus GitHub Actions erfolgreich war. Keine Integration vorher.
  - id: wikipedia_pageviews
    dimension: [attention, event_risk]
    provider: "Wikimedia Analytics REST API, Pageviews je Artikel (täglich, Agent 'user')"
    license: "Wikimedia-Daten unter freien Lizenzen; Lizenz der Pageview-Daten und Rate-Limits (seit 2026 neu) prüfen: REVIEW_REQUIRED"
    pit: publication_date        # Tageswert ab Folgetag; spätere Bot-Bereinigung möglich -> Revisionsprüfung offen
    history_from: 2015
    acquisition_cost: 1
    access_verified: false
    status: candidate
    registry_source_ids: [wikimedia_pageviews]   # Audit 2026-11-07: KEIN neuer Connector – läuft seit 15.10. (503 Ticker)
    audit_2026_11_07: "Zuordnung: Artikel aus Links der S&P-500-Liste; Weiterleitungstitel (z. B. Fifth_Third_Bancorp, Median 4 Aufrufe/Tag) zählen nur die Weiterleitungsseite. 5-T-IC des PIT-Aufmerksamkeitsschocks +0,036 (t 1,5, 9 Tage), partiell +0,033 – kein Nachweis."
  - id: openfda_enforcement
    dimension: [event_risk, product_quality]
    provider: "openFDA Enforcement Reports (food/drug/device), report_date, recalling_firm"
    license: "laut Sekundärquellen gemeinfrei (CC0); offizielle Bedingungen/Limits prüfen: REVIEW_REQUIRED"
    pit: publication_date        # report_date = Veröffentlichung durch die FDA (wöchentlich)
    history_from: 2004
    acquisition_cost: 1
    access_verified: false
    status: candidate
    audit_2026_11_07: "Zugang aus der Entwicklungsumgebung nicht prüfbar (Host nicht freigegeben). Inhaltlich: report_date liegt meist Wochen nach der Rückrufmeldung des Unternehmens bzw. der FDA-Pressemitteilung -> zum report_date ist die Information typischerweise öffentlich; recall_initiation_date ist historisch nicht PIT (Look-ahead). openFDA liefert nur den aktuellen Stand (keine Vintages). Firmenzuordnung über recalling_firm (Freitext, Tochterfirmen). Die Pipeline führt bereits fda_headline_count. Kein Pilot ohne Live-Prüfung."
  - id: federal_register_documents
    dimension: [regulatory, event_risk]
    provider: "Federal Register API v1 (documents, agencies, publication date)"
    license: "laut Sekundärquellen gemeinfrei, ohne Schlüssel; offizielle Bedingungen prüfen: REVIEW_REQUIRED"
    pit: publication_date
    history_from: 1994
    acquisition_cost: 1
    access_verified: false
    status: candidate
    audit_2026_11_07: "Zugang aus der Entwicklungsumgebung nicht prüfbar (Host nicht freigegeben). Inhaltlich: publication_date ist exakt (tägliche Ausgabe), Public-Inspection-Zeitpunkt früher; Dokumente nennen Behörden, selten Unternehmen -> überwiegend Sektor-Zuordnung, hoher Zuordnungsaufwand. Kein Pilot ohne Live-Prüfung."
  - id: usgs_river_stage
    dimension: [freight_supply_chain, commodities]
    provider: "USGS Water Services (NWIS) Pegel/Abfluss, z. B. Mississippi/Ohio"
    license: "US-Behördendaten; Bedingungen prüfen: REVIEW_REQUIRED"
    pit: forward_archive_only    # vorläufige Werte werden revidiert -> historisch nicht PIT
    history_from: 1990
    acquisition_cost: 1
    access_verified: false
    status: candidate
  - id: gdelt_events
    dimension: [event_risk, attention]
    provider: "GDELT 2.0 Event/GKG-Dateien (15-Minuten-Takt)"
    license: "frei mit Quellenangabe laut Projekt; prüfen: REVIEW_REQUIRED"
    pit: publication_date
    history_from: 2015
    acquisition_cost: 3          # große Rohdaten, Deduplizierung, Entity-Mapping
    access_verified: false
    status: candidate
