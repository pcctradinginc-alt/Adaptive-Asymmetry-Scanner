# config/research_domains.yaml – Domänen-Katalog der Scientific Hypothesis Factory
#
# Ideen entstehen aus Kombinationen Datendomäne × Exposure (Sektor). Der Katalog
# sagt nur, WELCHE Daten wofür prinzipiell relevant sein könnten und wo sie frei
# zu bekommen wären – NICHT, dass ein Zusammenhang besteht. Status der Daten
# wird bei jedem Lauf gegen den PIT-Feature-Store geprüft (DATA_GAP sonst).

domains:
  rates:        {features: [tnx, curve_10y_3m], kind: pit_panel, label: "Zinsen/Zinskurve"}
  volatility:   {features: [vix, vix_chg_21], kind: pit_panel, label: "Marktvolatilität"}
  inflation:    {features: [cpi_yoy], kind: pit_panel, label: "Inflation (ALFRED-Vintages)"}
  liquidity:    {features: [fed_assets_13w_chg], kind: pit_panel, label: "Fed-Bilanz/Liquidität"}
  dollar:       {features: [usd_63d_chg], kind: pit_panel, label: "US-Dollar"}
  oil:          {features: [wti_63d_chg], kind: pit_panel, label: "Ölpreis"}
  trend:        {features: [spy_trend_200, spy_mom_63], kind: pit_panel, label: "Markttrend"}
  insider:      {features: [sec_insider_net_value_90d], kind: alt_feature, source: sec_deep_events, label: "Insider-Transaktionen"}
  procurement:  {features: [ted_awards_z], kind: alt_feature, source: ted_procurement, label: "EU-Ausschreibungen"}
  fundamentals: {features: [xbrl_sue, xbrl_rev_yoy, xbrl_accruals, xbrl_asset_growth, xbrl_share_change], kind: alt_feature, source: sec_xbrl_fundamentals, label: "Fundamentaldaten (SEC XBRL, PIT)"}
  # Commodity Intelligence (EIA/FRED/CFTC, RESEARCH): Datums-Features PIT, Exposure-Mapping NON_PIT
  commodity_oil_price:   {features: [cmd_wti_ret_20d, cmd_wti_ret_60d, cmd_wti_z_60d], kind: alt_feature, source: commodity_price, label: "Ölpreis (FRED/ALFRED)"}
  commodity_gas_price:   {features: [cmd_henry_hub_ret_20d, cmd_henry_hub_ret_60d], kind: alt_feature, source: commodity_price, label: "Henry-Hub-Gaspreis (FRED/ALFRED)"}
  commodity_metal_ag_price: {features: [cmd_copper_ret_3m, cmd_corn_ret_3m, cmd_wheat_ret_3m, cmd_soybeans_ret_3m], kind: alt_feature, source: commodity_price, label: "Kupfer/Agrarpreise (IMF via FRED, monatlich)"}
  commodity_oil_fundamentals: {features: [cmd_crude_stocks_vs_5y, cmd_crude_stocks_chg_z_52w, cmd_product_supplied_chg_4w, cmd_refinery_utilization_z_52w], kind: alt_feature, source: commodity_fundamental, label: "Öl-Fundamentaldaten (EIA WPSR)"}
  commodity_gas_fundamentals: {features: [cmd_natgas_storage_vs_5y, cmd_natgas_storage_chg_z_52w, cmd_lng_exports_yoy], kind: alt_feature, source: commodity_fundamental, label: "Gas-Fundamentaldaten (EIA)"}
  commodity_positioning: {features: [cmd_cot_crude_oil_mm_pctile_1y, cmd_cot_natural_gas_mm_pctile_1y, cmd_cot_gold_mm_pctile_1y, cmd_cot_copper_mm_pctile_1y, cmd_cot_crude_oil_mm_net_chg_4w], kind: alt_feature, source: commodity_positioning, label: "Futures-Positionierung (CFTC COT)"}
  commodity_storage_surprise: {kind: missing, label: "Gas-/Öl-Lagerüberraschung vs. Konsens",
                 free_sources: [], note: "Keine offizielle kostenlose Konsens-Erwartung -> EXPECTATION_UNKNOWN (kein Ersatz durch Schätzung)"}
  weather:      {kind: missing, label: "Wetteranomalien",
                 free_sources: ["NOAA GHCN-Daily / NCEI CDO (Token frei)", "Open-Meteo Archive API", "DWD CDC (Deutschland)"],
                 note: "Archiv (outputs/external_data) vorhanden, aber nicht als PIT-Querschnittsfeature im Panel"}
  river_levels: {kind: missing, label: "Flusspegel/Binnenschifffahrt",
                 free_sources: ["USGS NWIS Water Services (Mississippi/Ohio, frei)", "PEGELONLINE WSV (Rhein Kaub, frei)"]}
  power_load:   {kind: missing, label: "Stromverbrauch",
                 free_sources: ["EIA-930 Hourly Electric Grid Monitor (API-Key frei)", "ENTSO-E Transparency (Token frei, Archiv vorhanden)"]}
  software_downloads: {kind: missing, label: "Software-Downloads",
                 free_sources: ["pypistats.org API (frei)", "npm downloads API api.npmjs.org (frei, ab 2015)", "GitHub API Stars/Releases (frei, Rate-Limit)"]}
  port_activity: {kind: missing, label: "Hafenaktivität",
                 free_sources: ["IMF PortWatch (frei, Archiv vorhanden, Historie kurz)"]}

# Ideenfamilien: Domäne × Sektor, Richtung, Mechanismus-Vorlage. exploratory = unorthodox.
# Signal = exp_<sektor> × sign(feature − center); center (Default 0) ist vorab festgelegt
# (Niveau-Merkmale: tnx 3 %, cpi_yoy 3 % – nie aus Ergebnissen gewählt).
families:
  - {id: rates_x_financials, domain: rates, feature: curve_10y_3m, sector: "Financial Services", direction: 1, relevance: 0.8,
     mechanism: "Steilere Zinskurve erhöht die Zinsmarge von Banken (Fristentransformation) – Analystenschätzungen passen sich verzögert an."}
  - {id: rates_x_realestate, domain: rates, feature: tnx, center: 3.0, sector: "Real Estate", direction: -1, relevance: 0.8,
     mechanism: "Steigende Langfristzinsen erhöhen Diskontrate und Finanzierungskosten von REITs."}
  - {id: oil_x_energy, domain: oil, feature: wti_63d_chg, sector: Energy, direction: 1, relevance: 0.7,
     mechanism: "Ölpreisanstiege erhöhen Upstream-Cashflows; Aktien preisen Futures-Kurve nur teilweise ein."}
  - {id: oil_x_airlines_industrials, domain: oil, feature: wti_63d_chg, sector: Industrials, direction: -1, relevance: 0.6,
     mechanism: "Höhere Treibstoff- und Energiekosten belasten Margen energieintensiver Industrie/Transport."}
  - {id: dollar_x_technology, domain: dollar, feature: usd_63d_chg, sector: Technology, direction: -1, relevance: 0.6,
     mechanism: "Starker Dollar senkt die in USD umgerechneten Auslandsumsätze multinationaler Tech-Firmen."}
  - {id: inflation_x_consumer_defensive, domain: inflation, feature: cpi_yoy, center: 3.0, sector: "Consumer Defensive", direction: 1, relevance: 0.5,
     mechanism: "Basiskonsumgüter geben Kosten mit Preissetzungsmacht weiter; bei hoher Inflation relativ robust."}
  - {id: volatility_x_utilities, domain: volatility, feature: vix_chg_21, sector: Utilities, direction: 1, relevance: 0.5,
     mechanism: "Steigende Unsicherheit führt zu Umschichtung in defensive, regulierte Cashflows."}
  - {id: liquidity_x_technology, domain: liquidity, feature: fed_assets_13w_chg, sector: Technology, direction: 1, relevance: 0.5, exploratory: true,
     mechanism: "Liquiditätszufluss senkt Risikoprämien; lang-duration Wachstumswerte profitieren überproportional."}
  - {id: trend_x_basic_materials, domain: trend, feature: spy_mom_63, sector: "Basic Materials", direction: 1, relevance: 0.4, exploratory: true,
     mechanism: "Zyklische Rohstofffirmen reagieren verzögert auf breite Marktmomentum-Phasen (Nachfrageerwartung)."}
  - {id: procurement_x_industrials, domain: procurement, feature: ted_awards_z, sector: Industrials, direction: 1, relevance: 0.6, exploratory: true,
     mechanism: "Gewonnene EU-Großaufträge erhöhen Auftragsbestand und Umsatzsichtbarkeit; verstreute Bekanntmachungen werden kaum aggregiert."}
  - {id: insider_x_healthcare, domain: insider, feature: sec_insider_net_value_90d, sector: Healthcare, direction: 1, relevance: 0.5, exploratory: true,
     mechanism: "In Healthcare (Studien, Zulassungen) ist der Informationsvorsprung von Insidern besonders groß."}
  - {id: weather_x_consumer, domain: weather, sector: "Consumer Cyclical", direction: 1, relevance: 0.5, exploratory: true,
     mechanism: "Wetteranomalien verschieben saisonale Nachfrage (Bekleidung, Freizeit) – Quartalszahlen überraschen."}
  - {id: river_x_chemicals, domain: river_levels, sector: "Basic Materials", direction: -1, relevance: 0.5, exploratory: true,
     mechanism: "Niedrige Pegel verteuern Binnenschiff-Transporte und drosseln Chemieproduktion (Rhein-Niedrigwasser 2018/2022)."}
  - {id: power_x_industrials, domain: power_load, sector: Industrials, direction: 1, relevance: 0.5, exploratory: true,
     mechanism: "Industrieller Stromverbrauch ist ein früher Indikator der Produktionsaktivität."}
  - {id: downloads_x_technology, domain: software_downloads, sector: Technology, direction: 1, relevance: 0.4, exploratory: true,
     mechanism: "Steigende Paket-/App-Downloads signalisieren Produktadoption vor Umsatzmeldungen."}
  # ── Commodity Intelligence (RESEARCH): Signal = cmdexp_<rohstoff> × sign(feature − center) ─────────────
  # cmdexp = erwartete Exposure-Richtung (+1/-1/0, NON_PIT-Mapping exposure-v1). Richtung 1 = die Hypothese
  # lautet "Titel entwickeln sich in Richtung ihrer Exposure"; die Gegenrichtung ist H_alt (kein Vorzeichenwechsel).
  - {id: cmd_oil_price_x_exposure, domain: commodity_oil_price, commodity: oil, feature: cmd_wti_ret_20d, direction: 1, relevance: 0.5,
     mechanism: "Ölpreisbewegungen ändern Cashflows ölexponierter Titel (Produzenten +, Verbraucher wie Airlines -); Analysten passen Schätzungen verzögert an."}
  - {id: cmd_oil_inventory_x_exposure, domain: commodity_oil_fundamentals, commodity: oil, feature: cmd_crude_stocks_vs_5y, direction: -1, relevance: 0.4,
     mechanism: "Rohölbestände über dem saisonalen 5J-Mittel signalisieren schwache Bilanz und Preisdruck – belastet Produzenten, entlastet Verbraucher."}
  - {id: cmd_oil_demand_x_exposure, domain: commodity_oil_fundamentals, commodity: oil, feature: cmd_product_supplied_chg_4w, direction: 1, relevance: 0.3, exploratory: true,
     mechanism: "Steigende implizite Nachfrage (Product Supplied) stützt den Ölpreis, bevor er sich im Preis zeigt."}
  - {id: cmd_gas_price_x_exposure, domain: commodity_gas_price, commodity: natural_gas, feature: cmd_henry_hub_ret_20d, direction: 1, relevance: 0.4,
     mechanism: "Henry-Hub-Anstiege erhöhen Erlöse von Gasproduzenten und Kosten gasintensiver Chemie/Dünger."}
  - {id: cmd_gas_storage_x_exposure, domain: commodity_gas_fundamentals, commodity: natural_gas, feature: cmd_natgas_storage_vs_5y, direction: -1, relevance: 0.4,
     mechanism: "Speicher über dem 5J-Mittel drückt den Gaspreis – negativ für Produzenten, positiv für Gasverbraucher."}
  - {id: cmd_oil_crowding_x_exposure, domain: commodity_positioning, commodity: oil, feature: cmd_cot_crude_oil_mm_pctile_1y, center: 0.5, direction: -1, relevance: 0.3, exploratory: true,
     mechanism: "Überfüllte Managed-Money-Longs im Rohöl erhöhen das Risiko einer Positionsauflösung; exponierte Aktien folgen verzögert."}
  - {id: cmd_copper_price_x_exposure, domain: commodity_metal_ag_price, commodity: copper, feature: cmd_copper_ret_3m, direction: 1, relevance: 0.3,
     mechanism: "Kupferpreis bestimmt Margen von Minen (+) und Inputkosten von Elektroausrüstern (-)."}
  - {id: cmd_gold_positioning_x_exposure, domain: commodity_positioning, commodity: gold, feature: cmd_cot_gold_mm_pctile_1y, center: 0.5, direction: 1, relevance: 0.2, exploratory: true,
     mechanism: "Ohne offiziellen kostenlosen Goldpreis: Managed-Money-Positionierung als Proxy der Goldnachfrage für Minen/Royalty-Titel."}
  - {id: cmd_corn_price_x_exposure, domain: commodity_metal_ag_price, commodity: corn, feature: cmd_corn_ret_3m, direction: 1, relevance: 0.2, exploratory: true,
     mechanism: "Höhere Maispreise stärken Farmeinkommen -> Nachfrage nach Landmaschinen, Dünger, Pflanzenschutz."}
