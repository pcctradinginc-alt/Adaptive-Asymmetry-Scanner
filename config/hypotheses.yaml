# config/hypotheses.yaml – Hypothesen (von Mensch oder Research-Agent formuliert)
#
# Geprüft von modules/research_lab.py mit der festen Kette aus
# config/research_protocol.yaml (geschützt). Ergebnisse (Gedächtnis):
# outputs/research/hypothesis_db.{json,md}.
#
# Regeln:
#   * Eine getestete Hypothese wird nicht umformuliert: anderes Signal -> neue id
#     (sonst "invalid_modified").
#   * signal: nur PIT-Merkmale des Feature-Stores (modules/ml_research.py,
#     ALL_FEATURES), + - * /, rank(), sign(), abs(). Labels sind unmöglich.
#   * direction: +1 = höheres Signal -> höhere Forward-Rendite erwartet.
#   * status blocked_data / prior_result: nicht testbar bzw. bereits anderweitig
#     geprüft – bleibt als Erinnerung in der Datenbank (keine Wiederentdeckung).

