# config/champion_protocol.yaml – der Champion als vorregistriertes Experiment (GESCHÜTZT, CODEOWNERS)
#
# Aktionsplan 2026-11-09, Punkt 1. Registriert vor dem ersten Trade des Messzeitraums. Auswertung:
# modules/champion_protocol.py; Alpha ausschließlich aus dem globalen Ledger (config/alpha_ledger.yaml, Klasse
# alpha_hypothesis, Teilsystem champion; Zuteilung durch modules/ledger_registration.py).
#
# Regeln:
#  * Primärkennzahl (einzige): outcome_net je geschlossenem Champion-Trade mit verlässlichem Outcome
#    (outcome_method in RELIABLE_OUTCOME_METHODS: Entry Ask, Exit Bid, abzüglich Kommission), entry_date >= start_date.
#  * decision_config_sha256 friert Gates, Filter, Risiko, Optionen, Pipeline, Modelle, Kosten, Haltedauer,
#    economics-first-Budget und die LLM-Prompt-Versionen ein. Jede Änderung daran = neue Protokollversion
#    (neue version, neuer start_date, neue Ledger-Zuteilung). Keine Gate-Änderung auf gesehenen Daten mehr.
#  * Neuregistrierung erforderlich, weil Timing und Hard-Risk-Verhalten des Champions geändert wurden.
#  * Test: einseitig H0 Expectancy <= 0 auf Tagesmitteln (Entry-Tag), t-Test; Prüfungen bei looks_at_n
#    verlässlichen Trades, Ledger-Alpha gleich auf die Prüfungen verteilt; Prüfberichte create-only eingefroren.
#  * Kein Einfluss auf Trades (nur Messung). Ergebnis im Wochenbericht.

version: "champion-v3-2026-11-11"
registered_on: "2026-11-11"
registered_at: "2026-11-11T19:20:00Z"
start_date: "2026-11-12"   # neuer Versuch nach Code-Audit; alte Ergebnisse bleiben historisch, nie gepoolt
hypothesis: "Die eingefrorene Champion-Pipeline erzielt eine positive verlässliche Netto-Optionsrendite je Trade."
primary_metric: "outcome_net (RELIABLE, Entry Ask / Exit Bid, abzüglich Kommission) je geschlossenem Champion-Trade"
looks_at_n: [30, 60, 90]
max_duration_days: 365
decision_config_sha256: "b39afb81728d61bfa8e0dcfd4b3edb3a0571f7cfcee080b629feec6d64880607"
