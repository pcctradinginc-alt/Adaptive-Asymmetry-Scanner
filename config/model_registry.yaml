# config/model_registry.yaml – Champion/Challenger-Registry der ML-Research-Modelle
#
# NUR SHADOW. Kein Modell dieser Datei beeinflusst Scoring, Gates, PPO oder
# Trades. modules/ml_research.py liest diese Datei, schreibt sie aber NIE.
#
# Regeln (Präregistrierung: docs/research/PREREG_ml_research_2026-09-29.md):
#   * Ein Eintrag wird nach der Registrierung nicht mehr geändert. Jede Änderung
#     an model/target/params/features braucht eine NEUE id (die Spezifikation
#     wird gehasht; ein geänderter Hash unter alter id -> "invalid_modified").
#   * Hyperparameter werden nur auf dem inneren Validierungsjahr gewählt, nie
#     auf Test- oder Locked-Daten.
#   * Der Locked-Holdout (ab locked_from) wird nur für registrierte Einträge
#     ausgewertet; jede Auswertung wird im Lock-Log gezählt (Mehrfachtests).
#   * Forward-Shadow zählt nur Prognosen NACH registered_at.
#   * champion wird ausschließlich per menschlichem PR gesetzt. Auch ein
#     Champion hat keine Produktionswirkung ohne separaten, begründeten PR.

champion: null                 # Produktion nutzt kein ML-Modell
# Locked-Holdout, Kosten und Promotionskriterien: config/research_protocol.yaml (geschützt)

models:
  - id: momentum_12_1
    registered_at: "2026-09-29T16:00:00Z"
    role: benchmark
    model: rule
    rule_feature: mom_12_1
    target: fwd_xs_20

  - id: enet_xs20_v1
    registered_at: "2026-09-29T16:00:00Z"
    role: challenger
    model: elastic_net
    target: fwd_xs_20
    features: all
    params_grid:
      alpha: [0.0003, 0.003]
      l1_ratio: [0.5]

  - id: hgb_xs20_v1
    registered_at: "2026-09-29T16:00:00Z"
    role: challenger
    model: hist_gbm
    target: fwd_xs_20
    features: all
    params_grid:
      max_iter: [150, 400]
      learning_rate: [0.05]
      max_depth: [3]
      min_samples_leaf: [300]

  - id: hgb_asym20_v1
    registered_at: "2026-09-29T16:00:00Z"
    role: challenger
    model: hist_gbm
    target: asym_20          # (MFE_20 + MAE_20) / (sigma20 * sqrt(20)): Chance minus Risiko, vol-normiert
    features: all
    params_grid:
      max_iter: [150, 400]
      learning_rate: [0.05]
      max_depth: [3]
      min_samples_leaf: [300]

  # Spezialisten (Registrierung 2026-09-29, zweite Welle): je Merkmalsgruppe ein
  # eigenes Modell; ein Meta-Modell kommt erst, wenn mindestens zwei Spezialisten
  # einzeln belegt sind (Präregistrierung).
  - id: hgb_xs20_momentum_v1
    registered_at: "2026-09-29T15:00:00Z"
    role: challenger
    model: hist_gbm
    target: fwd_xs_20
    features: ["group:momentum", "group:liquidity"]
    params_grid:
      max_iter: [150, 400]
      learning_rate: [0.05]
      max_depth: [3]
      min_samples_leaf: [300]

  - id: hgb_xs20_risk_regime_v1
    registered_at: "2026-09-29T15:00:00Z"
    role: challenger
    model: hist_gbm
    target: fwd_xs_20
    features: ["group:risk", "group:market", "group:macro"]
    params_grid:
      max_iter: [150, 400]
      learning_rate: [0.05]
      max_depth: [3]
      min_samples_leaf: [300]
