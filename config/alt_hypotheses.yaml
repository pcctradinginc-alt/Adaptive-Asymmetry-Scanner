    baseline: "Querschnittsmittel desselben Stichtags, Kosten 10 bp/Seite"
    primary_metric: "netto Top-Dezil-Überrendite je 20 T"
    economic_rationale: "Ein Anstieg gewonnener öffentlicher Aufträge erhöht die Umsatzsichtbarkeit; verstreute EU-Bekanntmachungen werden von Analysten kaum aggregiert (langsame Informationsdiffusion)."
