    forward_start: "2026-10-05"
    promotion_criteria: "Research-Protokoll bestanden UND >= 26 Forward-Kohorten mit positiver Netto-Expectancy; danach nur über PromotionController"
    failure_condition: "Walk-Forward netto <= 0 ODER nicht signifikant nach BH ODER Forward-Expectancy <= 0 nach 26 Kohorten"

