# config/cost_policy.yaml – Kosten-Telemetrie, Budgets, Preisliste (modules/cost_telemetry.py)
#
# Grundsätze
#   - Telemetrie darf NIE die Funktion brechen: jeder Fehler beim Erfassen wird verschluckt.
#   - Kosten = gemessene usage-Felder der Anthropic-Antwort x offizielle Preise unten.
#     Unbekanntes Modell -> cost_usd = null ("nicht verfügbar"), nie 0.
#   - Budget-Wächter drosseln ZUERST Research/Shadow, dann optionale Analysen.
#     Produktionskritische Deep Analysis wird NIE still übersprungen (nur Warnung).
#   - Bezahlte Tarife werden nie automatisch aktiviert: Wechsel in einen Paid-Tarif
#     erfordert Warnung + menschliche Freigabe (paid_tier_approved).

version: cost-v1

# Offizielle Anthropic-Preise in USD pro 1 Mio. Tokens
# (Quelle: https://platform.claude.com/docs/en/about-claude/pricing, abgerufen 2026-10-03).
# input = nicht gecachter Rest, cache_write_5m/1h = cache_creation_input_tokens,
# cache_read = cache_read_input_tokens. Batch-API: 50 % auf input/output (stapelbar mit Caching).
pricing_source: "https://platform.claude.com/docs/en/about-claude/pricing (2026-10-03)"
batch_discount: 0.5
models:
  claude-sonnet-4-6:          {family: SONNET, input: 3.00, cache_write_5m: 3.75, cache_write_1h: 6.00, cache_read: 0.30, output: 15.00}
  claude-haiku-4-5-20251001:  {family: HAIKU,  input: 1.00, cache_write_5m: 1.25, cache_write_1h: 2.00, cache_read: 0.10, output: 5.00}
  claude-haiku-4-5:           {family: HAIKU,  input: 1.00, cache_write_5m: 1.25, cache_write_1h: 2.00, cache_read: 0.10, output: 5.00}
  claude-opus-5-5:            {family: OPUS,   input: 4.00, cache_write_5m: 5.00, cache_write_1h: 8.00, cache_read: 0.20, output: 20.00}

# Workflow -> Bereich. production = Scanner-Entscheidungspfad; shadow/research = drosselbar.
scopes:
  scanner: production              # kind=api-Zähler des Scanner-Prozesses (nur Kennzeichnung)
  prescreening: production
  deep_analysis: production
  shadow_relation: shadow
  ea_claims: shadow                  # Expectation-Alpha-Claims (Logging, drosselbar)
  hypothesis_factory: research

# Budgets (USD). Warnung ab warn_fraction; ab 100 % werden drosselbare Bereiche
# (throttle_order, in dieser Reihenfolge) pausiert. production wird nie gedrosselt.
budgets:
  weekly_llm_usd: 6.0             # Batch-Phase ~19 $/Monat; Zielbild nach A/B-Stufen < 5 $/Monat (scripts/cost_baseline.py --project)
  monthly_llm_usd: 25.0
  warn_fraction: 0.80
  throttle_order: [research, shadow]

# API-Kostenziel (2026-10-09, docs/API_COST_OPTIMIZATION.md). Projektion = MTD + Ø je Scanner-Tag x
# verbleibende Handelstage. Über dem Ziel: Report + Warnung + TIER4_OPTIONAL zurückgestellt; RESEARCH erst an
# den harten Grenzen oben (budgets). TIER1_PRODUCTION_REQUIRED/TIER2_IMPORTANT nie budgetgedrosselt
# (Tiers: config/data_freshness.yaml).
api_budget:
  monthly_api_budget_usd: 10.0
  monthly_soft_budget_usd: 10.0
  daily_soft_budget_usd: 0.45      # 10 $ / ~22 Handelstage

# Analyse-Hash-Cache der Deep Analysis.
#   observe = Hash wird berechnet, mögliche Treffer + Ersparnis protokolliert, Sonnet läuft trotzdem.
#   active  = identische Eingaben innerhalb TTL liefern das gespeicherte Ergebnis (kein Sonnet-Call).
#   auto    = observe, bis der gepaarte Vergleich (analysis_cache.activation_report) KEEP meldet,
#             danach active (vorab festgelegte Kriterien, docs/COST_OPTIMIZATION.md).
analysis_cache:
  mode: auto
  ttl_hours: 26                    # deckt den nächsten Tageslauf ab (Cron 1x täglich)
  price_move_bucket_pct: 1.0       # 48h-Bewegung wird auf diese Schrittweite gerundet (Hash-Stabilität)

# Kostenrelevante Fremd-APIs: nur Zählung/Quota, keine Aktivierung von Paid-Fallbacks.
# plan: free | paid | unknown. free_daily_limit = dokumentierte Free-Tier-Grenze (null = unbekannt).
paid_apis:
  tradier:       {hosts: [api.tradier.com, sandbox.tradier.com], plan: unknown, free_daily_limit: null, estimated_cost_usd_month: null, paid_tier_approved: false}
  finnhub:       {hosts: [finnhub.io], plan: free, free_daily_limit: null, rate_limit_per_min: 60, estimated_cost_usd_month: 0, paid_tier_approved: false}
  newsapi:       {hosts: [newsapi.org], plan: free, free_daily_limit: 100, estimated_cost_usd_month: 0, paid_tier_approved: false}
  alpha_vantage: {hosts: [www.alphavantage.co], plan: free, free_daily_limit: 25, estimated_cost_usd_month: 0, paid_tier_approved: false}
  flashalpha:    {hosts: [api.flashalpha.com], plan: unknown, free_daily_limit: null, estimated_cost_usd_month: null, paid_tier_approved: false}
  eulerpool:     {hosts: [api.eulerpool.com], plan: unknown, free_daily_limit: null, estimated_cost_usd_month: null, paid_tier_approved: false}
  fred:          {hosts: [api.stlouisfed.org], plan: free, free_daily_limit: null, rate_limit_per_min: 120, estimated_cost_usd_month: 0, paid_tier_approved: false}

# Message Batches API: 50 % Rabatt bei identischem Modell und Prompt (Qualität unverändert).
# Ergebnisse, die nicht binnen max_wait_minutes (und vor dem Laufzeitbudget) vorliegen,
# werden synchron nachgeholt – kein Kandidat geht verloren.
batch:
  enabled: true
  workflows: [deep_analysis, prescreening, shadow_relation]
  max_wait_minutes: 20
  max_wait_minutes_by_workflow: {prescreening: 10, shadow_relation: 10}
  poll_seconds: 20
  min_requests: 2

# Modell-Routing nur nach gepaartem A/B auf identischen Prompts (modules/model_routing.py).
# mode: observe = nur messen | auto = nach erfüllten Kriterien umschalten (mit Monitoring
# und automatischem Rückfall) | off. Kriterien sind vorab festgelegt und werden nicht nachträglich
# angepasst.
model_routing:
  deep_analysis:
    challenger: claude-haiku-4-5-20251001
    mode: auto
    sample_per_run: 6            # A/B-Paare je Lauf (im selben Batch, -50 %)
    monitor_sample_per_run: 2    # nach Umschaltung: Champion-Stichprobe zur Überwachung
    min_pairs: 80
    min_days: 10
    min_gate_agreement: 0.92
    min_pass_recall: 0.90
    min_direction_agreement: 0.90
    monitor_window: 40
    # Ausgabe-Limit je Modell (2026-10-09): Haiku-Antworten enden bei ~1.400–1.560 Token, 8 von 18
    # A/B-Antworten wurden bei 1.600 abgeschnitten und verfälschten den Vergleich. Gilt für die
    # A/B-Stichprobe UND – nur falls ein Modell per bestehender Policy aktiv wird – für dessen Calls.
    # Champion (Sonnet) bleibt bei 1.600 (0 Abschnitte), Produktion damit unverändert.
    max_tokens_default: 1600
    max_tokens_by_model:
      claude-haiku-4-5-20251001: 2400

# Bearish-Vorfilter: solange Bearish-Trades deaktiviert sind, werden Kandidaten, die bereits der
# Prescreen als BEARISH einstuft, nicht mehr per Deep Analysis bewertet – erst nachdem gepaarte
# Messung zeigt, dass dabei praktisch keine Gate-bestandenen Kandidaten verloren gehen.
bearish_prefilter:
  mode: auto
  min_pass_n: 40
  min_days: 10
  max_pass_loss: 0.05
  monitor_sample_per_run: 2

# Kompaktes Prescreen-Ausgabeformat (Begründung nur bei [YES]): aktiv erst, wenn ein gepaarter
# Vergleich auf denselben Batches gleiche YES/NO-Entscheidungen zeigt.
prescreen_compact:
  mode: auto
  check_batches_per_run: 1
  min_decisions: 200
  min_days: 5
  min_agreement: 0.95
  min_yes_ratio: 0.90
