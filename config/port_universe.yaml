# config/port_universe.yaml
#
# Kuratiertes Port-/Chokepoint-Universum. Nur NAMEN + Land werden hier
# gespeichert -- Port-/Chokepoint-IDs werden ausschließlich zur Laufzeit gegen
# die offiziellen PortWatch-Referenz-Layer ("Ports", "Chokepoints") aufgelöst
# (exakter/normalisierter Name + Land). Mehrdeutige oder nicht gefundene
# Einträge werden als "unresolved" protokolliert -- NIE erraten.

groups:
  US_WEST:
    - name: "Los Angeles"
      country: "United States"
    # Long Beach: PortWatch führt den San-Pedro-Bay-Komplex nur als
    # "Los Angeles" (port664, Preflight 2026-09-27) -> nicht separat, sonst
    # Doppelzählung.

  US_EAST:
    - name: "New York-New Jersey"
      country: "United States"
    - name: "Savannah"
      country: "United States"

  US_GULF:
    - name: "Houston"
      country: "United States"

  NORTH_EUROPE:
    - name: "Rotterdam"
      country: "Netherlands"
    - name: "Antwerp(-Bruges)"
      country: "Belgium"
    - name: "Hamburg"
      country: "Germany"
    - name: "Bremerhaven"
      country: "Germany"

  MEDITERRANEAN:
    - name: "Valencia"
      country: "Spain"
    - name: "Piraeus"
      country: "Greece"
    - name: "Genoa"
      country: "Italy"

  CHINA:
    - name: "Shanghai"
      country: "China"
    - name: "Ningbo(-Zhoushan)"
      country: "China"
    - name: "Shenzhen"
      country: "China"
    - name: "Qingdao"
      country: "China"

  JAPAN_KOREA:
    - name: "Busan"
      country: "South Korea"
    - name: "Yokohama"
      country: "Japan"
    - name: "Tokyo"
      country: "Japan"
    - name: "Kobe"
      country: "Japan"

  SE_ASIA:
    - name: "Singapore"
      country: "Singapore"
    - name: "Port Klang"
      country: "Malaysia"
    - name: "Laem Chabang"
      country: "Thailand"

  MIDDLE_EAST:
    - name: "Jebel Ali"
      country: "United Arab Emirates"
    - name: "Jeddah"
      country: "Saudi Arabia"

# Chokepoints-Allowlist (item 5). Ebenfalls nur Namen -- IDs werden gegen den
# offiziellen "Chokepoints"-Referenz-Layer aufgelöst.
chokepoints:
  - name: "Suez Canal"
    country: "Egypt"
    slug: suez
  - name: "Bab el-Mandeb"
    country: null
    slug: bab_el_mandeb
  - name: "Strait of Hormuz"
    country: null
    slug: hormuz
  - name: "Malacca Strait"
    country: null
    slug: malacca
  - name: "Panama Canal"
    country: "Panama"
    slug: panama
  - name: "Taiwan Strait"
    country: null
    slug: taiwan
  - name: "Gibraltar Strait"
    country: null
    slug: gibraltar
  - name: "Bosporus Strait"
    country: "Turkey"
    slug: bosporus

# Chokepoint-Name-Alias-Tabelle (item 2 des PW2-Fixes).
# Reine Wortstellung ("Strait of X" <-> "X Strait") wird bereits im Code
# normalisiert (normalize_name); diese Tabelle deckt echte
# Schreib-/Bezeichnungsvarianten ab, die keine reine Normalisierung lösen
# kann. Matching ist case-/punctuation-insensitiv (normalize_name) und wird
# NUR gegen Namen akzeptiert, die tatsächlich im offiziellen PortWatch-
# Chokepoints-Referenz-Layer vorkommen (siehe discovered_ids["diagnostics"]
# ["available_chokepoints"] im Preflight-Report) -- nie geraten.
chokepoint_aliases:
  "Bab el-Mandeb":
    - "Bab el-Mandeb Strait"      # offizieller Layer-Name (Preflight 2026-09-27)
  "Malacca Strait":
    - "Strait of Malacca"
  "Taiwan Strait":
    - "Strait of Taiwan"
  "Gibraltar Strait":
    - "Strait of Gibraltar"
  "Bosporus Strait":
    - "Strait of Bosporus"
    - "Bosphorus Strait"
    - "Strait of Bosphorus"
    - "Bosporus"
    - "Bosphorus"
    - "Turkish Straits"

# Offizielle PortWatch-Hafennamen (World-Port-Index-Schreibweise), jeweils im
# Live-Preflight vom 2026-09-27 als vorhandener Layer-Name beobachtet. Nur
# eindeutige Treffer; mehrdeutige Fälle nach Daten (portcalls) entschieden,
# siehe preflight diagnostics unresolved_ports_hint_activity.
port_aliases:
  "Antwerp(-Bruges)": ["Antwerp"]
  "Piraeus": ["Piraievs"]
  "Genoa": ["Genova"]
  "Busan": ["Pusan"]
  "Yokohama": ["Yokohama Ko"]
  "Tokyo": ["Tokyo Ko"]
  "Jebel Ali": ["Mina Jabal Ali"]
  "Jeddah": ["Jiddah"]
  # Preflight 2026-09-27, entschieden nach portcalls im Abruffenster:
  "Ningbo(-Zhoushan)": ["Ningbo"]        # port824, 668 Anläufe (Zhoushan port1429 separat, 241)
  "Shenzhen": ["Shekou"]                 # port1189, 111 (Chiwan 10; Yantian nicht im Layer)
  "Qingdao": ["Qingdao Gang"]            # port1069, 364 (Qingdao Port port1070: 81)
  "Laem Chabang": ["Si Racha"]           # port1197, Thailand, 229 (Laem Chabang liegt in Si Racha)

# Suchwörter für die Preflight-Diagnose unaufgelöster Häfen (nur Anzeige,
# kein automatisches Matching; Treffer werden manuell zu port_aliases).
port_search_hints:
  "Long Beach": ["Long Beach", "Los Angeles", "San Pedro"]
  "Ningbo(-Zhoushan)": ["Ningbo", "Zhoushan", "Beilun", "Zhenhai"]
  "Shenzhen": ["Shenzhen", "Shekou", "Yantian", "Chiwan", "Da Chan", "Mawan"]
  "Qingdao": ["Qingdao", "Huangdao", "Dongjiakou"]
  "Laem Chabang": ["Laem", "Chabang", "Si Racha", "Sriracha"]

# Feature-Konfiguration (item 7 Defaults; hier zentral, nicht im Code
# hart verdrahtet, damit sie ohne Code-Änderung angepasst werden können).
feature_config:
  min_valid_ports_for_breadth: 8
  incomplete_day_min_coverage: 0.90
  breadth_z_threshold: 1.0
