- &ea_base
  hypothesis_id: EA001_EXPECTATION_GAP
  version: 1
  title: Expectation Gap in Thesenrichtung
  created_at: '2026-10-10'
  registered_at: '2026-10-10T12:00:00Z'
  forward_start: '2026-10-13T00:00:00Z'
  created_by: claude-code (Expectation Alpha V1, SHADOW)
  source_type: causal_research
  eligible_stage: EA_NEWS_CANDIDATE
  baseline_population: EA_NEWS_CANDIDATE
