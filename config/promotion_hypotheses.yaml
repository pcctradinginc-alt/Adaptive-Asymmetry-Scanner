  research_question: Haben PIT-Expectation-Gaps (Modell-Zukunftszustand minus markt-implizite Erwartung), die zur Thesenrichtung und Sektor-Sensitivität passen, inkrementelle Prognosekraft für News-Kandidaten?
  economic_rationale: Preise bewegen sich mit Überraschungen gegenüber der eingepreisten Erwartung; ein Kandidat, dessen Makrotreiber vom Markt unterschätzt wird, sollte zusätzlich zur News profitieren.
  h1: Kandidaten mit Gap in Thesenrichtung haben eine höhere Netto-Rendite als die Gesamtpopulation mit verfügbarem Gap
  exposure: Makro-Domänen Inflation, Zinsen, Wachstum, Öl (Sektor-Mapping ea-sector-map-v1, NON_PIT)
  signal_definition: ea_gap_aligned
