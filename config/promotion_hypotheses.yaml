  primary_metric: Netto-Richtungsrendite des Basiswerts (ea_close_to_close_v1, Kosten 2×10 bp) – Δ Expectancy gefeuert vs. alle in der Population
  secondary_metrics: [win_rate, median_return, profit_factor, mfe, mae, max_drawdown, downside_tail_10pct, triggered_minus_non_triggered]
  baseline: Alle EA-Kandidaten derselben Periode mit verfügbarem Gap (gefeuert vs. nicht gefeuert innerhalb der Population)
  minimum_sample_size: 100
  minimum_independent_dates: 40
  minimum_calendar_span: 180
