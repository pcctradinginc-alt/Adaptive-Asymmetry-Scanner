# config/promotion_hypotheses.yaml – Verträge für Hypothesen mit möglicher Produktionswirkung (GESCHÜTZT)
#
# Unveränderlich ab registered_at (spec_hash in outputs/intelligence/contract_registry.jsonl).
# Änderung von Schwelle/Richtung/Merkmal = NEUE hypothesis_id oder version.
# Alle Initialverträge: production_class abstention (dürfen höchstens einen
# Champion-Trade blockieren, nie einen erzeugen). Schwellen aus
# Merkmals-VERTEILUNGEN (ml_cards 2026-10-02), nie aus Outcomes.
# Forward-Evidenz zählt erst ab forward_start (2026-10-05).

contracts:
- version: 1
  created_at: '2026-10-03'
  registered_at: '2026-10-03T12:00:00Z'
  forward_start: '2026-10-05T00:00:00Z'
  created_by: claude-code (Promotion-Brücke, Initialverträge)
  universe: Champion-Trade-Vorschläge der Produktionspipeline (pipeline.py, nach Score-/Korrelations-Filter)
  population: Champion-akzeptierte Trade-Vorschläge (Optionen auf US-Aktien, S&P 500/Nasdaq-100)
  direction: -1
  production_class: abstention
  maximum_initial_influence: ABSTENTION_ONLY
  outcome_horizon: Haltedauer der Produktion (Exit-Regeln feedback.py, max. learning.close_after_days)
  primary_metric: Netto-Optionsrendite je Trade (history.outcome) – Δ Expectancy blockiert vs. durchgelassen
  secondary_metrics: &id001
  - win_rate
  - profit_factor
  - max_drawdown
  - brier
  - ece
  - precision
  - false_positive_rate
  - mfe
  - mae
  baseline: 'Champion-only: alle Champion-akzeptierten Trades desselben Zeitraums ohne Eingriff'
  minimum_sample_size: 60
  minimum_independent_dates: 20
  minimum_calendar_span: 90
  sector_scope: &id002
  - all
  regime_scope: &id003
  - all
  promotion_criteria: &id004
    delta_expectancy_min: 0.0
    ci_lower_min: 0.0
    require_outlier_robust: true
    require_time_windows_positive: 2
    calibration_not_worse: true
    max_drawdown_not_worse_by: 0.1
    min_fired_observations: 15
    min_fired_independent_dates: 8
  demotion_criteria: &id005
    rolling_window_observations: 30
    abstention_net_value_min: 0.0
    rolling_expectancy_blocked_max: 0.0
    effect_reversal_ci_upper_max: 0.0
    integrity_failure: ROLLBACK
  hypothesis_id: PROM-ABST-001
  title: Safe Mode aktiv -> Champion-Trade abstinieren
  source_type: model_drift
  research_question: Sind Champion-Trades, die bei aktivem Safe Mode (Feature-/Datendrift, Regime außerhalb Trainingsbereich) vorgeschlagen werden, schlechter als die übrigen?
  economic_rationale: Safe Mode zeigt an, dass die Research-Modelle außerhalb ihres Trainingsbereichs sind; Gleiches gilt für Kalibrierung und Marktumfeld der Champion-Signale.
  exposure: Gesamtmarkt (Regime-/Datendrift)
  signal_definition: safe_mode_active
  features:
  - safe_mode_active
  thresholds:
    op: '>='
    value: 1
  failure_condition: Trades mit Safe Mode haben Expectancy >= durchgelassene ODER CI der Differenz schließt 0 nach Forward-Minimum ein
