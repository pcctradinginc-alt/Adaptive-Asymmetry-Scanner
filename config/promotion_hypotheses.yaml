  universe: Deep-Analysis-Kandidaten der Produktionspipeline (US-Aktien S&P 500/Nasdaq-100), vor Bearish-Gate, ISF-Floor, MC, ROI und Adapter
  population: EA_NEWS_CANDIDATE (nicht Champion-Trades)
