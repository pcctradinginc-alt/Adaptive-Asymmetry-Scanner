# ── Expectation Alpha (EA001–EA007): Population EA_NEWS_CANDIDATE (registriert 2026-10-10, vor jeder Forward-Beobachtung) ──
# V1 SHADOW: production_class research_only (Leiter ["NONE"]) -> höchstens FORWARD_VALIDATED, nie Einfluss.
