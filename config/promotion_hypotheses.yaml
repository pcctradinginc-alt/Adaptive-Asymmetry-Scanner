- <<: *ea_base
  hypothesis_id: EA002_CONFIRMATION
  title: Cross-Asset-Bestätigung bei großen Gaps
  population_definition: EA-Kandidaten mit |Gap-z| >= 1,0 und mindestens 3 verfügbaren Bestätigungssignalen
  baseline: Alle EA-Kandidaten mit großem Gap und ausreichend Bestätigungssignalen
  research_question: Verbessert eine hohe Cross-Asset-Bestätigungsquote (>= 0,7) die Outcomes bei ähnlich großen Expectation Gaps?
  economic_rationale: Ein Gap ohne Marktbewegung kann lange bestehen; bestätigende Bewegungen in Credit, Zinsen, Sektoren und Rohstoffen zeigen, dass der Markt beginnt, die Modellsicht einzupreisen.
  h1: Bei |Gap-z| >= 1 schneiden Kandidaten mit confirmation_ratio >= 0,7 netto besser ab als alle Kandidaten mit großem Gap
  exposure: Cross-Asset (Credit, Zinsen, Sektoren, Rohstoffe, Volatilitätsstruktur)
  signal_definition: ea_confirmation_ratio
  population_filter: ea_gap_abs_z >= 1.0 and ea_confirmation_available >= 3
  features: [ea_confirmation_ratio, ea_gap_abs_z, ea_confirmation_available]
  thresholds: {op: '>=', value: 0.7}
  failure_condition: Hohe Bestätigung nicht besser als alle großen Gaps nach Forward-Minimum
- <<: *ea_base
  hypothesis_id: EA003_ACCELERATION
  title: Beschleunigung des Gaps in Thesenrichtung
  population_definition: EA-Kandidaten mit Gap in Thesenrichtung und bekannter Gap-Beschleunigung
  baseline: Alle gap-ausgerichteten EA-Kandidaten (Level-Baseline)
  research_question: Liefert die Beschleunigung (letzter Monat schneller als das 3M-Tempo) des Gaps in Thesenrichtung einen Zusatznutzen gegenüber dem Gap-Level allein?
  economic_rationale: Märkte reagieren auf Änderungsraten; ein sich beschleunigender Gap signalisiert, dass die Abweichung zwischen Fundamentaldaten und Preis zunimmt.
  h1: Unter gap-ausgerichteten Kandidaten schneiden solche mit Beschleunigung in Thesenrichtung netto besser ab
  exposure: Dynamik der Makro-Gaps (velocity/acceleration, future_state.roc_frame)
  signal_definition: ea_gap_accel_aligned
  population_filter: ea_gap_aligned == 1 and ea_gap_accel_aligned >= 0
  features: [ea_gap_accel_aligned, ea_gap_aligned]
  thresholds: {op: '>=', value: 1}
  failure_condition: Beschleunigung liefert keinen Zusatz zur Level-Baseline nach Forward-Minimum
- <<: *ea_base
  hypothesis_id: EA004_WAIT
  title: Triggerbasierter Einstieg statt Sofort-Einstieg (WAIT)
  ea_outcome_kind: paired_wait_delta
  minimum_sample_size: 60
  minimum_independent_dates: 30
  minimum_independent_event_clusters: 40
  population_definition: EA-Kandidaten mit Status WAIT (vorab registrierter Trigger, max. 10 Handelstage)
  baseline: Gepaart je WAIT-Beobachtung – Sofort-Einstieg am Entscheidungstag, gleicher Ausstiegstag
  primary_metric: Gepaarte Netto-Differenz (Trigger-Einstieg bzw. Cash ohne Trigger minus Sofort-Einstieg) am gleichen Ausstiegstag
  research_question: Verbessert der vorab registrierte WAIT-Trigger Rendite und MAE gegenüber dem Sofort-Einstieg?
  economic_rationale: Fehlende Marktbestätigung erhöht das Risiko früher Verluste; Warten auf Bestätigung kann schlechte Einstiege vermeiden.
  h1: Für WAIT-Fälle ist die Trigger-Policy netto besser als der Sofort-Einstieg (gepaart)
  exposure: Timing (Cross-Asset-Bestätigung, Sektor-RS)
  signal_definition: ea_is_wait
  population_filter: ea_is_wait == 1
  features: [ea_is_wait]
  thresholds: {op: '>=', value: 1}
  failure_condition: Gepaarte Differenz <= 0 oder CI schließt 0 ein nach Forward-Minimum
- <<: *ea_base
  hypothesis_id: EA005_CONTEXT_FILTER
