  title: Hohe Modelluneinigkeit -> abstinieren
  source_type: meta_learning_failure
  research_question: Haben Champion-Trades in Titeln mit hoher ML-Modelluneinigkeit (oberstes Dezil der Querschnittsverteilung, Schwelle 0.36 aus Verteilung 2026-10-02, ohne Outcome-Sicht) eine niedrigere
    Expectancy?
  economic_rationale: Uneinigkeit der Basismodelle = epistemische Unsicherheit; Optionstrades auf unsichere Titel tragen höheres Fehlbewertungsrisiko.
  exposure: Einzeltitel (ML-Karte)
  signal_definition: ml_disagreement_sd
  features:
  - ml_disagreement_sd
  thresholds:
