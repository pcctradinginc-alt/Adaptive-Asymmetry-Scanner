# config/faf_exposure.yaml
#
# NOT YET BUILT — placeholder.
#
# Compact FHWA Freight Analysis Framework (FAF5) structural exposure map:
# commodity (SCTG2) <-> origin-state shares, state <-> commodity mix, and
# mode shares. Built by scripts/build_faf_exposure.py from the official
# FAF5 state-level database (https://faf.ornl.gov/faf5/), which is NOT
# fetched automatically on every scanner run — this is a structural
# exposure table (rebuilt manually / on a new FAF5 release), never a live
# feed.
#
# To (re)build:
#     python3 scripts/build_faf_exposure.py --out config/faf_exposure.yaml
#
# meta.built_at is the built-marker consumed by
# scripts/build_faf_exposure.py:exposure_states_for_industry() — while it
# is null/missing, the loader returns None (not {}), and the registry
# entry config/external_sources/road_freight.yaml (source_id fhwa_faf)
# carries status_override: DEFERRED.

meta:
  source_url: null
  faf_version: null
  year: null
  built_at: null
  sha256_of_zip: null
sctg_names: {}
commodity_state_shares: {}
state_commodity_mix: {}
mode_shares: {}
